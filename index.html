const agentChat=mod=>{S.chats=S.chats||{};return S.chats[mod]||(S.chats[mod]=[]);};
const agentBtn=m=>'';
function sampleErrNote(e){
  const code=e&&e.code,part=(e&&e.text)||'';let off='';
  if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code))off='No tienes permiso para usar Claude desde la app. Puedes activarlo en el menú de permisos del artefacto.';
  const note=code==='cancelled'?'(Respuesta detenida.)':code==='rate_limited'?'Has hecho muchas preguntas seguidas o has llegado a tu límite de uso. Prueba de nuevo en un rato.':code==='refused'?'No puedo responder a eso. Prueba a plantearlo de otra forma.':code==='session_expired'?'Tu sesión ha caducado: vuelve a iniciar sesión en Claude.':off?'':'No se pudo completar la respuesta. Inténtalo de nuevo.';
  return{off,answer:[code==='refused'?'':part,note].filter(Boolean).join('\n\n')};
}
function agLive(){
  const el=document.getElementById('ag-live');if(!el)return;
  el.innerHTML=AG.live?fmtMsg(AG.live):`<p class="typing">${esc(AG.status||'Pensando…')}</p>`;
  const log=document.getElementById('ag-log');if(log)log.scrollTop=log.scrollHeight;
}
function renderAgent(){
  const root=$('#agentRoot');if(!root)return;
  if(!AG.open||!AGENTS[AG.mod]){root.hidden=true;root.innerHTML='';return;}
  const m=AG.mod,A=AGENTS[m],chat=agentChat(m);
  const msgs=chat.map(x=>`<div class="msg ${x.role==='user'?'u':'a'}">${x.role==='user'?`<p>${esc(x.content)}</p>`:fmtMsg(x.content)}</div>`).join('');
  const live=AG.busy?`<div class="msg a" id="ag-live">${AG.live?fmtMsg(AG.live):`<p class="typing">${esc(AG.status||'Pensando…')}</p>`}</div>`:'';
  const hi=!chat.length&&!AG.busy?`<div class="chat-hi"><b>¿En qué te ayudo con ${esc(MODS[m].t.toLowerCase())}?</b><span>Conozco tus datos de esta sección${A.tools?' y puedo guardar lo que te proponga si me lo pides':''}.</span><div class="chips">${A.sugs.map(q=>`<button class="chip" data-action="agent-chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div></div>`:'';
  const off=AG.off||(CHAT.avail===false?'El asistente funciona al abrir la app dentro de Claude con tu sesión iniciada.':'');
  root.innerHTML=`<aside class="agent" role="dialog" aria-label="Asistente de ${esc(MODS[m].t)}" style="--c:var(${MODS[m].c})">
    <div class="ag-h"><span class="ag-ic">${icon('spark',18,2)}</span><div><span class="eyebrow">Asistente</span><b>${esc(MODS[m].t)}</b></div><div class="ag-a">${chat.length&&!AG.busy?B('Nueva','agent-new','','small'):''}<button class="iconbtn" data-action="agent-close" aria-label="Cerrar el asistente">${icon('close',16,2.2)}</button></div></div>
    <div class="chat-log" id="ag-log">${hi}${msgs}${live}</div>
    ${chat.length&&!AG.busy?`<div class="chips sugs">${A.sugs.map(q=>`<button class="chip" data-action="agent-chip" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`:''}
    ${off?`<div class="empty">${esc(off)}</div>`:`<div class="chat-in"><textarea id="ag-in" rows="1" placeholder="Escribe tu pregunta…" aria-label="Pregunta para el asistente">${esc(AG.draft)}</textarea>${AG.busy?B('Detener','agent-stop','','small'):B('Enviar','agent-send','','primary')}</div>`}
    <p class="foot">Usa tu cuenta de Claude. Consejos generales: no sustituyen a un profesional.</p></aside>`;
  root.hidden=false;
  const log=document.getElementById('ag-log');if(log)log.scrollTop=log.scrollHeight;
}
function agentOpen(m){
  if(!AGENTS[m])return;AG.open=true;if(!AG.busy)AG.mod=m;
  if(CHAT.avail===null)getSample().then(s=>{CHAT.avail=!!s;if(AG.open)renderAgent();});
  renderAgent();const i=document.getElementById('ag-in');if(i&&matchMedia('(min-width:600px)').matches)i.focus();
}
async function agentAsk(q){
  q=String(q||'').trim();if(!q||AG.busy)return;
  const m=AG.mod,A=AGENTS[m];if(!A)return;
  const sample=await getSample();if(!sample){CHAT.avail=false;renderAgent();return;}
  const chat=agentChat(m);chat.push({role:'user',content:q});
  AG.draft='';AG.busy=true;AG.live='';AG.status='';AG.changed=new Set();renderAgent();
  const turns=[{role:'user',content:A.rules()},...chat.slice(-12).filter(x=>x.content&&x.content.trim())];
  AG.ctl=new AbortController();
  let tools;if(A.tools){try{const lim=await sample.limits();if(lim&&lim.tools)tools=A.tools();}catch(e){}}
  let answer='';
  try{
    const r=await sample(turns,{signal:AG.ctl.signal,cache:false,modelTier:'default',...(tools?{tools}:{}),onText:({text})=>{AG.live=text;AG.status='';agLive();}});
    answer=r.text+(r.truncated?'\n\n(Respuesta cortada: prueba a preguntar menos cosas a la vez.)':'');
  }catch(e){const x=sampleErrNote(e);if(x.off)AG.off=x.off;answer=x.answer;}
  finally{
    if(answer)chat.push({role:'assistant',content:answer});else chat.pop();
    S.chats[m]=chat.slice(-30);AG.busy=false;AG.ctl=null;AG.live='';AG.status='';
    commit('chats',...AG.changed);AG.changed=new Set();renderAgent();
  }
}

function phaseOn(d){
  const ci=cycleInfo();if(!ci.last)return null;
  if((S.cycle.days[d]&&S.cycle.days[d].period)||ci.predDays.includes(d))return 'menstrual';
  let start=null;for(const g of ci.groups)if(g.start<=d)start=g.start;
  for(let k=0;start&&addDays(start,ci.avgC)<=d&&k<24;k++)start=addDays(start,ci.avgC);
  if(!start)return null;
  const n=diff(start,d)+1,L=ci.avgC,ov=L-14;
  if(n<=ci.avgP)return 'menstrual';if(Math.abs(n-ov)<=1)return 'ovulatoria';if(n<ov-1)return 'folicular';if(n>=L-6)return 'premenstrual';return 'lutea';
}

/* ================= fichas de ejercicio: posición inicial/final, movimiento y músculos ================= */
/* Figura articulada de perfil (mirando a la derecha) en un lienzo de 200×200; el suelo está en y=180.
   Ángulos en grados: t = tronco desde la vertical (+ inclinado hacia delante); a/e = brazo desde abajo (+ hacia delante) y flexión del codo;
   l/k = muslo desde abajo (+ hacia delante) y flexión de rodilla; c = curvatura de la espalda; hd = giro de la cabeza. */
const SEGL={T:50,UA:28,FA:26,TH:38,SH:38,FT:11,HD:17};
const rd=d=>d*Math.PI/180,dnv=(d,L)=>[Math.sin(rd(d))*L,Math.cos(rd(d))*L],upv=(d,L)=>[Math.sin(rd(d))*L,-Math.cos(rd(d))*L],vadd=(p,v)=>[p[0]+v[0],p[1]+v[1]];
function figJoints(P){
  const hip=[0,0],t=P.t||0,sh=vadd(hip,upv(t,SEGL.T)),head=vadd(sh,upv(t+(P.hd||0),SEGL.HD));
  const arm=(a,e)=>{const el=vadd(sh,dnv(a,SEGL.UA));return[el,vadd(el,dnv(a+e,SEGL.FA))];};
  const leg=(l,k,f)=>{const kn=vadd(hip,dnv(l,SEGL.TH)),s=l-k,an=vadd(kn,dnv(s,SEGL.SH));return[kn,an,vadd(an,dnv(f!=null?f:s+90,SEGL.FT))];};
  const a1=P.a1||0,e1=P.e1||0,l1=P.l1||0,k1=P.k1||0;
  const [e_1,h_1]=arm(a1,e1),[e_2,h_2]=arm(P.a2!=null?P.a2:a1,P.e2!=null?P.e2:e1);
  const [k_1,an_1,f_1]=leg(l1,k1,P.f1),[k_2,an_2,f_2]=leg(P.l2!=null?P.l2:l1,P.k2!=null?P.k2:k1,P.f2!=null?P.f2:P.f1);
  const J={hip,sh,head,e1:e_1,h1:h_1,e2:e_2,h2:h_2,k1:k_1,an1:an_1,f1:f_1,k2:k_2,an2:an_2,f2:f_2};
  const pin=P.pin||'an1',at=P.at||[100,178],dv=[at[0]-J[pin][0],at[1]-J[pin][1]];
  for(const k in J)J[k]=vadd(J[k],dv);
  for(const n of [1,2]){const tg=P['ik'+n];if(!tg)continue;const d=[tg[0]-J.hip[0],tg[1]-J.hip[1]],dist=Math.min(Math.hypot(d[0],d[1]),SEGL.TH+SEGL.SH-.01),th=Math.acos(dist/(SEGL.TH+SEGL.SH))*180/Math.PI,ph=Math.atan2(d[0],d[1])*180/Math.PI,kn=vadd(J.hip,dnv(ph+th,SEGL.TH)),an=vadd(kn,dnv(ph-th,SEGL.SH)),f=P['f'+n]!=null?P['f'+n]:(n===2&&P.f1!=null?P.f1:ph-th+90);J['k'+n]=kn;J['an'+n]=an;J['f'+n]=vadd(an,dnv(f,SEGL.FT));}
  J.c=P.c||0;return J;
}
const lerpJ=(A,B,u)=>{const o={};for(const k in A)o[k]=Array.isArray(A[k])?[A[k][0]+(B[k][0]-A[k][0])*u,A[k][1]+(B[k][1]-A[k][1])*u]:A[k]+(B[k]-A[k])*u;return o;};
function lerpPose(P0,P1,u){
  if((P0.pin||'an1')!==(P1.pin||'an1')||String(P0.at)!==String(P1.at)||P0.ik1||P0.ik2||P1.ik1||P1.ik2)return lerpJ(figJoints(P0),figJoints(P1),u);
  const P={pin:P0.pin,at:P0.at};for(const k of ['t','a1','e1','a2','e2','l1','k1','l2','k2','f1','f2','c','hd']){const x=P0[k],y=P1[k];if(x!=null||y!=null)P[k]=(x!=null?x:(y!=null?y:0))+((y!=null?y:(x!=null?x:0))-(x!=null?x:0))*u;}
  return figJoints(P);
}
const pt=p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`;
function figSVG(J,props,opts={}){
  const S='stroke-linecap="round" stroke-linejoin="round" fill="none"';
  const line=(a,b,w,cls)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" class="${cls}" stroke-width="${w}" stroke-linecap="round"/>`;

/* ================= material: poleas, máquinas y equivalentes con mancuernas ================= */
const EQUIP={
  'Prensa de piernas':{tipo:'Máquina',montaje:['Ajusta el respaldo para que, con los pies en la plataforma, las rodillas queden a unos 90° al bajar.','Pies a la anchura de las caderas, en el centro de la plataforma.','Quita el seguro solo cuando estés colocada y vuelve a ponerlo al terminar.']},
  'Pallof press en polea':{tipo:'Polea a la altura del pecho',montaje:['Pon la polea a la altura de tu pecho y engancha el agarre de una mano (en D).','Colócate de lado a la polea y separa 1-2 pasos largos hasta notar tensión.','Pies a la anchura de las caderas y rodillas un poco flexionadas. Sujeta el agarre con las dos manos pegado al esternón.','Estira los brazos al frente, aguanta 2 segundos sin dejar que la polea te gire y vuelve. Haz todas las repeticiones y cambia de lado.','Peso: la placa más ligera que te dé tensión (2,5-5 kg).'],
    alt:E('Paseo con una mancuerna (suitcase carry)','3','30 pasos por lado','Una mancuerna ligera en una mano: camina erguida sin inclinarte hacia el peso y cambia de mano en cada vuelta.','Como el Pallof, entrena el core para que el peso no te incline ni te tuerza: protege la columna.')},
  'Jalón al pecho agarre neutro':{tipo:'Máquina de jalón o polea alta',def:true,montaje:['Engancha en la polea alta la barra de agarre neutro (palmas enfrentadas) o el triángulo ancho.','Siéntate y ajusta el rodillo para que sujete los muslos.','Tira hasta el esternón llevando los codos hacia abajo y atrás; sube despacio hasta estirar los brazos.'],
    alt:E('Pullover con mancuerna en banco','4','10','Tumbada en el banco, sujeta una mancuerna con las dos manos sobre el pecho. Bájala por detrás de la cabeza con los codos casi estirados y vuelve.','Sustituye al jalón: trabaja el dorsal sin máquina y con la espalda apoyada.')},
  'Remo sentado en polea':{tipo:'Polea baja',def:true,montaje:['Pon la polea abajo del todo y engancha el agarre en V (triángulo).','Siéntate con los pies en la plataforma y las rodillas un poco dobladas.','Tronco vertical: tira hacia el ombligo con los codos pegados al cuerpo y junta las escápulas.'],
    alt:E('Remo con mancuernas con pecho apoyado','3','12','Banco inclinado a 30-45°, con el pecho apoyado y una mancuerna en cada mano. Tira de los codos hacia la cadera y junta las escápulas.','Sustituye al remo en polea: con el pecho apoyado, la columna no carga nada.')},
  'Press de pecho en máquina':{tipo:'Máquina',def:true,montaje:['Ajusta el asiento para que los agarres queden a la altura de la mitad del pecho.','Espalda y cabeza apoyadas en el respaldo.'],
    alt:E('Press de pecho con mancuernas','3','10','Tumbada en banco plano con los pies en el suelo. Baja las mancuernas a los lados del pecho con los codos a unos 45° y empuja.','Sustituye a la máquina: el mismo trabajo de pecho, y cada brazo empuja su parte.')},
  'Face pull':{tipo:'Polea alta con cuerda',montaje:['Sube la polea a la altura de tu frente y engancha la cuerda de dos cabos.','Agarra un cabo con cada mano, pulgares hacia ti, y da 2 pasos atrás.','Tira hacia la cara separando las manos, con los codos a la altura de los hombros, y junta las escápulas 1 segundo.','Peso ligero (5-10 kg): si te balanceas, baja la carga.'],
    alt:E('Pájaro con mancuernas con pecho apoyado','3','15','Banco inclinado con el pecho apoyado. Abre los brazos hacia los lados hasta la altura de los hombros con mancuernas ligeras (1-3 kg).','Sustituye al face pull: hombro posterior y escápulas, clave para la postura.')},
  'Remo invertido en TRX o máquina':{tipo:'TRX o máquina',def:true,montaje:['Cintas del TRX a media altura: cuanto más vertical estés, más fácil.','Cuerpo en bloque de los talones a la cabeza.'],
    alt:E('Remo con mancuernas con pecho apoyado','3','10','Banco inclinado a 30-45°, con el pecho apoyado y una mancuerna en cada mano. Tira de los codos hacia la cadera.','Sustituye al remo invertido: espalda fuerte con la columna apoyada.')}
};
const eqOf=name=>{for(const k in EQUIP){if(k===name)return{orig:k,info:EQUIP[k],swapped:false};if(EQUIP[k].alt&&EQUIP[k].alt.n===name)return{orig:k,info:EQUIP[k],swapped:true};}return null;};
const swapOn=n=>{const sw=S.gym.swap||{};return n in sw?!!sw[n]:!!(EQUIP[n]&&EQUIP[n].def);};
const progEx=e=>{const q=EQUIP[e.n];return q&&q.alt&&swapOn(e.n)?{...q.alt,from:e.n}:e;};
const progExAll=()=>PROGRAM.flatMap(p=>p.ej.map(progEx)).concat(PROGRAM.flatMap(p=>p.ej));
const eqTag=e=>{const q=eqOf(e.n);if(!q)return '';return q.swapped?'<span class="pex-tag mc">Mancuernas</span>':`<span class="pex-tag po">${/polea/i.test(q.info.tipo)?'Polea':'Máquina'}</span>`;};
function eqBox(name){
  const q=eqOf(name);if(!q)return '';const {info,orig,swapped}=q;
  if(swapped)return `<div class="eqbox"><div class="subhd" style="padding-top:0">Versión con mancuernas</div><p class="minfo">Sustituye a <b>${esc(orig)}</b> (${esc(info.tipo.toLowerCase())}), porque en tu gimnasio casi no hay máquinas de espalda.</p>${B('Volver a la versión original','eq-swap',`data-n="${esc(orig)}"`,'small')}</div>`;
  return `<div class="eqbox"><div class="subhd" style="padding-top:0">Cómo se monta · ${esc(info.tipo)}</div><ol>${info.montaje.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${info.alt?`<p class="minfo">Sin ${/polea/i.test(info.tipo)?'polea':'máquina'}: <b>${esc(info.alt.n)}</b>.</p>${B('Cambiar por la versión con mancuernas','eq-swap',`data-n="${esc(orig)}"`,'small soft')}`:''}</div>`;
}
function eqSwap(orig){
  const q=EQUIP[orig];if(!q||!q.alt)return;
  const now=!swapOn(orig);S.gym.swap=S.gym.swap||{};S.gym.swap[orig]=now;
  const from=now?orig:q.alt.n,to=now?q.alt:PROGRAM.flatMap(p=>p.ej).find(e=>e.n===orig);
  for(const r of S.gym.routines)if(String(r.id).startsWith('pg-'))r.exercises=(r.exercises||[]).map(x=>x.n===from?{n:to.n,s:+to.s||1,r:parseInt(to.r)||1,w:null,note:to.r}:x);
  commit('gym');toast(now?'Cambiado por la versión con mancuernas':'Vuelves a la versión original');
  const e=progExAll().find(x=>x.n===to.n)||to;exSheet(to.n,{sr:e.s==='1'?e.r:e.s+' × '+e.r,c:e.c,p:e.p});
}

/* las rutinas del programa ya activadas adoptan las versiones con mancuernas elegidas */
function syncProgRoutines(){
  if(isDemo||!(S.gym.program&&S.gym.program.active))return false;let ch=false;
  for(const r of S.gym.routines){if(!String(r.id).startsWith('pg-'))continue;r.exercises=(r.exercises||[]).map(x=>{const q=EQUIP[x.n];if(q&&q.alt&&swapOn(x.n)&&!(S.gym.live&&S.gym.live.rid===r.id)){ch=true;return{n:q.alt.n,s:+q.alt.s||1,r:parseInt(q.alt.r)||1,w:null,note:q.alt.r};}return x;});}
  return ch;
}

  for(const t of S.diario.tags||BIEN_TAGS)f[t]=tags.includes(t);

function bienFindings(rows){
  const keys=new Set();rows.forEach(r=>Object.keys(r.f).forEach(k=>keys.add(k)));
  const out=[];
  for(const k of keys){const a=rows.filter(r=>r.f[k]===true),b=rows.filter(r=>r.f[k]===false);if(a.length<3||b.length<3)continue;
    const ma=avgOf(a.map(r=>+r.mood)),mb=avgOf(b.map(r=>+r.mood)),ea=a.filter(r=>r.energy),eb=b.filter(r=>r.energy);
    out.push({k,d:ma-mb,ma,mb,na:a.length,nb:b.length,de:ea.length>=3&&eb.length>=3?avgOf(ea.map(r=>+r.energy))-avgOf(eb.map(r=>+r.energy)):null});}
  const keep=[];for(const o of out.filter(o=>Math.abs(o.d)>=.3).sort((x,y)=>Math.abs(y.d)*Math.min(y.na,y.nb)**.5-Math.abs(x.d)*Math.min(x.na,x.nb)**.5))if(!keep.some(p=>p.na===o.nb&&p.nb===o.na&&Math.abs(p.d+o.d)<1e-9))keep.push(o);
  return keep;
  return out.filter(o=>Math.abs(o.d)>=.3).sort((x,y)=>Math.abs(y.d)*Math.min(y.na,y.nb)**.5-Math.abs(x.d)*Math.min(x.na,x.nb)**.5);
}
function bienExtremes(rows){

  const keys=new Set();rows.forEach(r=>Object.keys(r.f).forEach(k=>keys.add(k)));
  const lift=set=>[...keys].map(k=>({k,s:share(set,k),all:share(rows,k)})).filter(o=>o.s-o.all>=.15&&o.s>=.3).sort((a,b)=>(b.s-b.all)-(a.s-a.all)).slice(0,4);

}

/* día del ciclo (y su duración) para cualquier fecha */
function cycDayOn(d){
  const ci=cycleInfo();if(!ci.last)return null;
  let start=null;for(const g of ci.groups)if(g.start<=d)start=g.start;
  if(!start)return null;
  for(let k=0;addDays(start,ci.avgC)<=d&&k<24&&start>=ci.last.start;k++)start=addDays(start,ci.avgC);
  const n=diff(start,d)+1,g=ci.groups.find(x=>x.start===start);
  return{n,L:(g&&g.len)||ci.avgC,P:ci.avgP,late:start===ci.last.start&&n>ci.avgC};
}
/* lleva el día real a la plantilla de 28: fase lútea fija de 14 días, folicular proporcional */
function cycTpl(n,L,P){
  const ov=Math.max(P+2,L-14);
  if(n>L)return 28;
  if(n<=P)return Math.min(n,5);
  if(n<=ov)return Math.max(6,Math.min(14,Math.round(5+(n-P)*9/(ov-P))));
  return Math.min(28,14+(n-ov));
}

const PRE_PIL=[
  {t:'Come para tu serotonina',ic:'food',c:'--mint',intro:'Tu cerebro fabrica serotonina y dopamina con lo que comes. Necesita materia prima (el triptófano y la tirosina de las proteínas), herramientas (vitamina B6, hierro y magnesio) e hidratos que ayuden al triptófano a llegar al cerebro. Antes de la regla, esa fábrica pierde el impulso del estrógeno: darle buena materia prima ayuda.',it:[
    ['Legumbres casi a diario','1 taza cocida, 4 o 5 días por semana','Lentejas, garbanzos y alubias reúnen en un solo plato triptófano, vitamina B6, magnesio, hierro y fibra. La fibra hace que la glucosa suba despacio (menos bajones y menos antojos) y alimenta a las bacterias intestinales que intervienen en el reciclaje de los estrógenos.','Desde que ovulas, una taza cocida (unos 180 g, un cazo) en la comida 4 o 5 días por semana. De merienda, hummus con verduras crudas; como snack, garbanzos tostados. Si te hinchan, empieza con media ración, enjuágalas bien si son de bote y añade comino o laurel.','p'],
    ['Un plátano al día','Vitamina B6, potasio y un hidrato amable','Un plátano mediano aporta unos 0,4 mg de vitamina B6 (un tercio de lo que necesitas al día). También lleva potasio, que ayuda a eliminar el líquido retenido, y un hidrato que facilita que el triptófano llegue al cerebro.','De postre o a media tarde. Si te pide dulce, plátano maduro con yogur y canela o con crema de cacahuete.','p'],
    ['Hidrato integral en la cena','Avena, arroz integral, patata o pan integral','Al comer hidratos, la insulina retira de la sangre otros aminoácidos que compiten con el triptófano, y entra más en el cerebro para fabricar serotonina y luego melatonina. En estudios del MIT, una comida rica en hidratos mejoró la depresión, la tensión y la ira premenstruales en 1 a 3 horas.','En tus últimos 7 días, cena un puño de hidrato integral con verdura y algo de proteína. Esos días evita cenar solo proteína con ensalada.','p'],
    ['Proteína en cada comida','Una palma: huevos, pescado, pollo, tofu o yogur griego','Aporta triptófano y tirosina, la materia prima de la serotonina y la dopamina, y frena los picos de glucosa que disparan el cortisol y la irritabilidad.','Una palma de tu mano en la comida y en la cena, y algo de proteína en el desayuno (huevos, yogur griego o queso fresco).','p'],
    ['Pescado azul 2 o 3 veces por semana','Salmón, sardinas, caballa o boquerones','El omega-3 (EPA y DHA) forma parte de las membranas de las neuronas y frena la inflamación. En ensayos clínicos redujo el dolor de regla y, en algunos, la ansiedad y el ánimo bajo premenstruales (para el ánimo la evidencia todavía es mixta).','Una lata de sardinas en la ensalada, salmón al horno o caballa en una tostada, 2 o 3 veces por semana.','m'],
    ['Un puñado de nueces o semillas','30 g al día','Aportan omega-3 vegetal, magnesio y zinc. El zinc es de los nutrientes con resultados más constantes en los ensayos sobre síntomas psicológicos premenstruales.','Un puñado (lo que cabe en tu mano cerrada) de nueces o almendras, y semillas de calabaza o lino molido en el yogur.','m'],
    ['Patrón mediterráneo y muchas plantas','Verdura en cada comida, fruta y aceite de oliva','Más fibra y antioxidantes significan menos inflamación y una flora intestinal más variada, que regula cuánto estrógeno se recicla. En un estudio, el síndrome premenstrual fue menos frecuente entre las mujeres que más seguían la dieta mediterránea (55 % frente a 74 %).','Medio plato de verdura en la comida y en la cena, 2 o 3 piezas de fruta, y aceite de oliva virgen extra como grasa principal.','p'],
    ['No saltarte comidas','Comer cada 3 o 4 horas','Las bajadas de glucosa activan el cortisol y la adrenalina, que notas como irritabilidad, ansiedad y un hambre voraz de dulce. Además, estos días gastas algo más de energía.','Lleva un snack preparado (fruta con frutos secos, un yogur o hummus) para la tarde en el trabajo o el viaje de vuelta.','p']]},
  {t:'Minerales y vitaminas clave',ic:'spark',c:'--sky',intro:'Son las herramientas con las que trabajan tus neuronas. Intenta cubrirlas con la comida. Los suplementos, tómalos solo si te los indica tu médica después de una analítica.',it:[
    ['Calcio','1.000 a 1.200 mg al día','Es lo que mejor ha funcionado. En un ensayo con casi 500 mujeres, 1.200 mg al día redujeron los síntomas un 48 % (un 30 % con placebo), también la tristeza y la irritabilidad. En el gran estudio de enfermeras de Harvard, las que tomaban más calcio y vitamina D en la comida tenían un 30 % menos de riesgo de síndrome premenstrual.','3 o 4 raciones al día, de unos 300 mg cada una: un vaso de leche o kéfir, 2 yogures, una lata de sardinas con espina o 40 g de queso curado. Sin lácteos: bebida vegetal enriquecida, tofu con calcio y almendras.','f'],
    ['Magnesio','310 a 320 mg al día','Calma la excitabilidad de las neuronas (frena el receptor NMDA y apoya al GABA) y relaja los músculos, también el del útero. Junto con la vitamina B6, redujo los síntomas premenstruales en ensayos clínicos.','Un puñado de semillas de calabaza (unos 150 mg), 30 g de almendras (unos 80 mg), una taza de garbanzos (unos 80 mg), 20 g de chocolate negro al 85 % (unos 45 mg), espinacas y pan integral.','m'],
    ['Vitamina B6','1,3 mg al día','Es la herramienta que convierte el triptófano en serotonina y la tirosina en dopamina, y ayuda a fabricar GABA. Una revisión publicada en el BMJ encontró que mejora los síntomas premenstruales, sobre todo la depresión.','Una taza de garbanzos (unos 1,1 mg), 100 g de pollo, pavo o salmón (unos 0,6 mg), un plátano (0,4 mg), patata o pistachos. Cuidado: los suplementos de más de 100 mg al día pueden dañar los nervios.','m'],
    ['Vitamina D','Sol y pescado azul','Interviene en la fabricación de serotonina y en la regulación del calcio. Tener niveles bajos se asocia a más síndrome premenstrual y peor ánimo. En mujeres con déficit, tomarla mejoró la ansiedad, la irritabilidad y la tristeza.','15 minutos de sol en la cara y los brazos a mediodía, más pescado azul y huevo. De octubre a marzo cuesta más conseguirla: pide que te la midan en la analítica y tómala en suplemento solo si te lo indican.','m'],
    ['Hierro (y ferritina)','Legumbres con vitamina C, carne o mejillones','La regla se lleva hierro, y la enzima que fabrica la dopamina lo necesita: con la ferritina baja aparecen cansancio, niebla mental y peor ánimo. En el estudio de enfermeras de Harvard, las que tomaban más hierro de origen vegetal tenían entre un 30 y un 40 % menos de riesgo de síndrome premenstrual.','Legumbres o espinacas con pimiento, tomate o naranja; carne roja magra o mejillones 1 o 2 veces por semana; café y té lejos de las comidas. Pide la ferritina en tu analítica.','p'],
    ['Zinc','Semillas de calabaza, marisco y legumbres','Interviene en las señales del glutamato y la serotonina. En una revisión de ensayos fue, junto con el calcio y la vitamina B6, de los nutrientes con beneficios más constantes en los síntomas psicológicos premenstruales.','Un puñado de semillas de calabaza, mejillones o berberechos, legumbres, huevos y frutos secos.','m']]},
  {t:'Mueve tu cuerpo',ic:'gym',c:'--peach',intro:'El ejercicio es de lo que más evidencia tiene. Funciona sobre todo si lo mantienes todo el mes, no solo los días malos.',it:[

    ['Tu entreno de fuerza','2 o 3 días por semana','Mejora la sensibilidad a la insulina (menos subidas y bajadas de glucosa, menos antojos), la autoestima y el sueño. No hace falta cambiar la rutina según la fase: guíate por cómo te sientes cada día.','Sigue tu programa del Gimnasio. Si un día premenstrual vas justa de energía, baja un poco el peso, pero no te saltes el entreno.','p'],
    ['Yoga y estiramientos','10 a 20 minutos','En ensayos clínicos, el yoga redujo los síntomas premenstruales y el dolor de regla. Baja el cortisol y activa el sistema nervioso que te calma.','En tus últimos 7 días, estiramientos de cadera y lumbares, la postura del niño o yoga suave antes de dormir.','m'],
    ['Pasear al aire libre','Mejor si hay zonas verdes','Combina movimiento, luz natural y naturaleza, y cada una de esas cosas ya baja el cortisol por sí sola.','Un paseo de 20 minutos al salir del trabajo o el sábado por la mañana, mejor por un parque o por la playa.','p']]},
  {t:'Duerme y busca la luz',ic:'clock',c:'--lav',intro:'Dormir mal lo amplifica todo: con poco sueño, la corteza prefrontal frena peor a la amígdala, el centro de las emociones. Además, la progesterona sube tu temperatura y hace el sueño más ligero.',it:[
    ['Horario fijo y 7 a 9 horas','También el fin de semana','Un horario estable sincroniza tu reloj interno, que regula la melatonina, el cortisol y la serotonina. Dormir poco aumenta la irritabilidad y los antojos del día siguiente.','Acuéstate y levántate siempre a la misma hora (el fin de semana, como mucho una hora más tarde).','m'],
    ['Habitación fresca','18 a 19 °C','En la fase lútea, la progesterona sube tu temperatura entre 0,3 y 0,5 °C, y el cuerpo necesita enfriarse para entrar en sueño profundo.','Ventila antes de dormir, usa ropa de cama ligera y date una ducha templada (no muy caliente) por la noche.','p'],
    ['Luz natural por la mañana','15 a 20 minutos','La luz de la mañana adelanta tu reloj interno: más serotonina de día y la melatonina a su hora por la noche. En ensayos pequeños, la terapia de luz brillante mejoró el ánimo de mujeres con trastorno disfórico premenstrual.','Sal a la calle antes de las 10, desayuna junto a la ventana o camina parte del trayecto al trabajo.','p'],
    ['Sin pantallas y cena temprana','La última hora antes de dormir','La luz azul de las pantallas retrasa la melatonina, y una cena tardía y abundante sube la temperatura y hace el sueño más ligero.','Cena 2 o 3 horas antes de acostarte, y pasa la última hora sin móvil: lectura, ducha o estiramientos.','p']]},
  {t:'Calma tu sistema nervioso',ic:'heart',c:'--rose',intro:'Antes de la regla tu cerebro reacciona con más fuerza al estrés: tienes menos GABA calmante y el cortisol sube más. No puedes evitar la bajada de hormonas, pero sí reducir lo que la amplifica.',it:[

}

/* ---------- Medicación con dosis según el ciclo (pauta indicada por la médica) ---------- */
/* pauta que le indicó su médica: 5 mg los 6 días antes de la regla y el día 1; 4,5 los días 2-3; 4 los días 4-5; 3,5 los días 6-7; 3 el resto */
const CDOSE_DEF={pre:6,preDose:5,base:3,unit:'ml',steps:[{a:1,b:2,mg:5},{a:3,b:4,mg:4.5},{a:5,b:6,mg:4}]};
const numES=v=>String(Math.round(+v*100)/100).replace('.',',');
const numIn=v=>{const x=parseFloat(String(v||'').replace(',','.'));return isFinite(x)?x:NaN;};
function parseSteps(txt){const out=[];for(const l of String(txt||'').split(/\n|;|·/)){const m=l.match(/(\d+)\s*(?:[-–a]\s*(\d+))?\s*[:=]\s*(\d+(?:[.,]\d+)?)/);if(m)out.push({a:+m[1],b:+(m[2]||m[1]),mg:numIn(m[3])});}return out.sort((x,y)=>x.a-y.a);}

const cycMed=()=>S.health.meds.find(m=>m.cyc&&(!m.end||m.end>=today()));
/* dosis de un día según el día del ciclo */
function cycDose(m,d){
  const c=m&&m.cyc;if(!c)return null;const cd=cycDayOn(d);if(!cd)return null;
  const L=cd.L,n=cd.n,left=L-n+1,u=c.unit||'mg';
  if(cd.late||n>L)return{mg:c.preDose,u,n,ph:'pre',why:'La regla aún no ha llegado: sigues con la dosis de antes de la regla hasta que baje.'};
  if(left<=c.pre)return{mg:c.preDose,u,n,ph:'pre',why:left===1?'La regla debería llegar mañana.':`Faltan unos ${left} días para la regla.`};
  const s=(c.steps||[]).find(s=>n>=s.a&&n<=s.b);
  if(s)return{mg:s.mg,u,n,ph:'down',why:n===1?'Primer día de regla: mantienes la dosis.':'Bajada progresiva después de la regla.'};

const doseTxt=x=>numES(x.mg)+' '+x.u;
function doseLabel(m,d){const x=cycDose(m,d);return x?doseTxt(x):(m.dose||'');}

  const pick=(a,o)=>a[(k+o)%a.length];
  const comidas=[P.bk,pick(P.mm,0),work?pick(P.sal,0):pick(P.casa,w),pick(P.me,0),pick(P.ce,1)];
  return{dia:DOWL[w],comidas,cyc:ci};
}
function cmWeek(w0){return [...Array(7)].map((_,i)=>{const d=addDays(w0,i);return cycMenuDay(d)||MENU_BASE[i];});}
/* lista de la compra de una semana */
function menuShop(){
  const w0=weekStart(UI.menuDate||today()),days=menuDays(),cnt={};
  days.forEach(day=>day.comidas.forEach(c=>(c.shop||[]).forEach(x=>cnt[x]=(cnt[x]||0)+1)));
  const items=Object.keys(cnt).sort((a,b)=>a.localeCompare(b,'es'));
  if(!items.length){toast('Este menú no tiene lista de la compra');return;}
  showListSheet(`Lista de la compra · ${fmtShort(w0)} – ${fmtShort(addDays(w0,6))}`,`<p class="minfo">Ingredientes del menú de esta semana según tu ciclo (el número indica cuántas comidas los usan).</p><div class="shop">${items.map(x=>`<label class="shop-i"><input type="checkbox"><span>${esc(cap(x))}</span>${cnt[x]>1?`<small>×${cnt[x]}</small>`:''}</label>`).join('')}</div>`,'--mint');
}
/* resumen del mes: comida y cena de cada día */
function menuMonth(){
  const t=today(),rows=[];
  for(let i=0;i<35;i++){const d=addDays(t,i),m=cycMenuDay(d);if(!m)continue;const F=CYF[m.cyc.f];
    rows.push(`<div class="mmrow" style="--c:var(${F.c})"><span class="mm-d"><b>${esc(cap(fmt(d,{weekday:'short',day:'numeric',month:'short'})))}</b><small>Día ${m.cyc.n} · ${esc(F.l.toLowerCase())}</small></span><span class="mm-m"><span>${esc(m.comidas[2].n)}</span><span>${esc(m.comidas[4].n)}</span></span></div>`);}
  if(!rows.length){toast('Registra tu regla en Ciclo para planificar el mes');return;}
  showListSheet('Tus próximas 5 semanas',`<p class="minfo">Comida y cena de cada día, adaptadas a la fase del ciclo en la que estarás. Toca un día en el menú semanal para ver el detalle completo.</p><div class="mmlist">${rows.join('')}</div><div class="row-b" style="margin-top:10px">${B('Prefiero mi menú fijo de siempre','menu-mode','','small')}</div>`,'--mint');

let SH=null,lastFocus=null,SH_recent=[],SH_PH={};
function fieldHTML(f){
  const id='f_'+f.id,v=f.value??'';
  switch(f.type){
    case 'textarea':return `<div class="f col"><label class="fl" for="${id}">${esc(f.label)}</label><textarea id="${id}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v)}</textarea>${f.hint?`<span class="fh">${esc(f.hint)}</span>`:''}</div>`;
    case 'chips':case 'seg':{const sel=(Array.isArray(v)?v:[v]).map(String);
      return `<div class="f col"><span class="fl">${esc(f.label)}</span><div class="chips" id="${id}" data-multi="${f.type==='chips'?1:0}" data-opt="${f.optional?1:0}" role="group" aria-label="${esc(f.label)}">${f.opts.map(o=>`<button type="button" class="chip" data-action="chip" data-v="${esc(o[0])}" aria-pressed="${sel.includes(String(o[0]))}">${o[3]?`<i class="dot" style="${bg(o[3])}"></i>`:o[2]?`<i class="sw" style="background:${o[2]}"></i>`:''}${esc(o[1])}</button>`).join('')||'<span class="fh">No hay opciones todavía.</span>'}</div>${f.hint?`<span class="fh">${esc(f.hint)}</span>`:''}</div>`;}
    case 'select':return `<label class="f"><span>${esc(f.label)}</span><select id="${id}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`;
    case 'toggle':return `<label class="f"><span>${esc(f.label)}</span><input type="checkbox" class="switch" id="${id}" ${v?'checked':''}></label>`;
    case 'photo':{const u=purl(v);return `<div class="f col"><span class="fl">${esc(f.label)}</span><div class="ph-field" id="${id}"><div class="ph-prev" id="${id}_prev" style="${u?bg(u):''}">${u?'':icon('camera',26)}</div><div class="ph-act"><div class="row-b"><label class="btn small primary" for="${id}_in">${icon('camera',14)}<span id="${id}_lbl">${u?'Cambiar foto':'Elegir foto'}</span></label><button type="button" class="btn small" data-action="ph-clear" data-f="${f.id}" id="${id}_clr" ${u?'':'hidden'}>Quitar</button></div><input type="file" id="${id}_in" accept="image/*" hidden data-photo-for="${f.id}"${f.hq?' data-hq="1"':''}><span class="fh">${esc(f.hint||'JPG o PNG. Se reduce automáticamente para ocupar poco.')}</span></div></div></div>`;}
    case 'html':return f.html;
    default:return `<label class="f"><span>${esc(f.label)}</span><input id="${id}" type="${f.type}" value="${esc(v)}" placeholder="${esc(f.ph||'')}" ${f.type==='number'?'inputmode="decimal" min="0" step="any"':''} autocomplete="off"></label>`;
  }
}
function openSheet(cfg){
  SH=cfg;SH_PH={};lastFocus=document.activeElement;
  const groups=[];let cur=[];
  for(const f of cfg.fields){if(f.sec!==undefined){if(cur.length)groups.push({fs:cur});cur=[];groups.push({hd:f.sec});continue;}cur.push(f);}
  if(cur.length)groups.push({fs:cur});
  const body=groups.map(g=>g.hd!==undefined?`<div class="fgroup-hd">${esc(g.hd)}</div>`:`<div class="fgroup">${g.fs.map(fieldHTML).join('')}</div>`).join('');
  const root=$('#sheetRoot');
  root.innerHTML=`<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" style="--c:var(${cfg.c||'--coral'})">
    <div class="sheet-h"><button class="link" style="--c:var(--ink2)" data-action="sheet-cancel">Cancelar</button><h3 id="shT">${esc(cfg.title)}</h3><button class="btn primary small" data-action="sheet-save">${esc(cfg.saveLabel||'Guardar')}</button></div>
    <div class="sheet-b"><p class="sheet-err" id="shErr" hidden></p>${body}${cfg.onDelete?`<button class="del-row" data-action="sheet-del">${esc(cfg.delLabel||'Eliminar')}</button>`:''}</div></div></div>`;
  root.hidden=false;
  const first=root.querySelector('input:not([type=checkbox]),textarea,select');
  if(first&&matchMedia('(min-width:600px)').matches)first.focus();else{const l=root.querySelector('.sheet-h .link');if(l)l.focus();}
}
function closeSheet(){exStop();const root=$('#sheetRoot');root.hidden=true;root.innerHTML='';SH=null;if(lastFocus&&lastFocus.focus&&document.body.contains(lastFocus))lastFocus.focus();}
function collect(fields){
  const v={};
  for(const f of fields){
    if(!f.id)continue;const el=document.getElementById('f_'+f.id);if(!el)continue;
    if(f.type==='chips'||f.type==='seg'){const vals=[...el.querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.v).map(x=>f.num?Number(x):x);v[f.id]=f.type==='seg'?(vals[0]??''):vals;}
    else if(f.type==='toggle')v[f.id]=el.checked;
    else if(f.type==='photo')v[f.id]=SH_PH[f.id]||null;
    else if(f.type==='number')v[f.id]=el.value===''?null:Number(String(el.value).replace(',','.'));
    else v[f.id]=el.value.trim();
  }
  return v;
}
function sheetSave(){
  if(!SH)return;
  const v=collect(SH.fields);
  const miss=SH.fields.find(f=>f.req&&(v[f.id]===''||v[f.id]==null||(Array.isArray(v[f.id])&&!v[f.id].length)));
  const err=$('#shErr');
  if(miss){err.textContent=`Falta completar: ${miss.label.toLowerCase()}.`;err.hidden=false;const el=document.getElementById('f_'+miss.id);if(el&&el.focus)el.focus();return;}
  const res=SH.onSave(v);
  if(typeof res==='string'){err.textContent=res;err.hidden=false;return;}
  closeSheet();
}

/* ================= datos: exportar / importar ================= */
function exportData(){
  const json=JSON.stringify({app:'mi-dia-a-dia',v:2,exported:new Date().toISOString(),data:S,photos:PH});
  if(!DL){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=`mi-dia-a-dia-${today()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);toast('Copia guardada en Descargas');return;}catch(e){}}
  if(DL){DL.save({filename:`mi-dia-a-dia-${today()}.json`,data:json}).then(()=>toast('Copia guardada')).catch(e=>{if(!e||e.code!=='declined')showJson(json);});return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(json).then(()=>toast('Copia copiada al portapapeles'),()=>showJson(json));return;}
  showJson(json);
}
function showJson(json){
  openSheet({title:'Copia de seguridad',saveLabel:'Listo',fields:[{id:'json',type:'textarea',label:'Selecciona y copia este texto para guardarlo',value:json,rows:12}],onSave:()=>{}});
  const ta=$('#f_json');if(ta){ta.focus();ta.select();}
}
function importData(text){
  try{
    const o=JSON.parse(text),data=o&&o.data?o.data:o;
    if(!data||typeof data!=='object'||!KEYS.some(k=>data[k]))throw new Error('formato');
    S=normalize(data);isDemo=false;if(o&&o.photos&&typeof o.photos==='object')for(const [k,d] of Object.entries(o.photos))if(typeof d==='string'&&d.startsWith('data:image'))putPhoto(k,d);KEYS.forEach(k=>dirty.add(k));commit();toast('Copia importada');
  }catch(e){toast('Ese archivo no es una copia válida de Mi Día a Día');}
}

document.addEventListener('click',e=>{
  if(e.target.matches&&e.target.matches('[data-scrim]')){closeSheet();return;}
  const a=e.target.closest('[data-action]');
  if(a){const f=ACT[a.dataset.action];if(f){e.preventDefault();f(a);}return;}
  const g=e.target.closest('[data-go]');
  if(g){if(SH)closeSheet();go(g.dataset.go);}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='medFood'){UI.medFood=el.value;UI.medUnit=medDefUnit(el.value);UI.medQty=1;render();return;}
  if(el.id==='cpFrom'||el.id==='cpTo'){UI[el.id]=el.value||null;render();return;}
  if(el.id==='medUnit'){UI.medUnit=+el.value;render();return;}
  if(el.id==='medGr'){UI.medGr=Math.max(1,Math.round(+el.value||0))||100;render();return;}
  if(el.id==='set_coach'){S.profile.coachDaily=el.checked;commit('profile');toast(el.checked?'Coach diario activado':'Coach diario desactivado');return;}
  if(el.id==='perToday'){const t=today(),x=S.cycle.days[t]||{flow:'',sym:[],mood:'',note:''};x.period=el.checked;if(x.period&&!x.flow)x.flow='Medio';
    if(!x.period&&!(x.sym&&x.sym.length)&&!x.mood&&!x.note)delete S.cycle.days[t];else S.cycle.days[t]=x;commit('cycle');return;}
  if(el.dataset&&el.dataset.set){const k=el.dataset.set;S.profile[k]=el.type==='number'?Math.max(0,Number(el.value)||0):el.value.trim();commit('profile');toast('Ajuste guardado');return;}
  if(el.dataset&&el.dataset.photoFor&&el.files&&el.files[0]){
    const f=el.dataset.photoFor,file=el.files[0];el.value='';
    const p=document.getElementById('f_'+f+'_prev');if(p)p.innerHTML='<span class="fh">Cargando…</span>';
    readImage(file,el.dataset.hq?1500:900,el.dataset.hq?480000:220000).then(d=>{if(!SH)return;SH_PH[f]={data:d};if(p){p.style.backgroundImage="url('"+d+"')";p.innerHTML='';}
      const c=document.getElementById('f_'+f+'_clr');if(c)c.hidden=false;const l=document.getElementById('f_'+f+'_lbl');if(l)l.textContent='Cambiar foto';})
      .catch(()=>{if(p)p.innerHTML=icon('camera',26);toast('No se pudo abrir esa imagen. Prueba con una foto JPG o PNG.');});
    return;}
  if(el.id==='importFile'&&el.files&&el.files[0]){const r=new FileReader();r.onload=()=>importData(String(r.result));r.readAsText(el.files[0]);el.value='';}
});

/* Ajuste a la ventana: el panel se diseña sobre un lienzo mínimo de 1200×760 y,
   si la ventana es más pequeña, se escala entero para que nunca haga falta desplazarse. */
const BASE_H=760,MOBILE_W=600,RAIL_W=1100;
let fitKey='';
function fit(){
  const app=$('.app'),root=document.documentElement,w=window.innerWidth,h=window.innerHeight;
  if(!app||!w||!h)return;
  fitKey=w+'x'+h;
  if(w<MOBILE_W){root.classList.remove('fit','rail');app.style.width=app.style.height=app.style.transform='';return;}
  const rail=w<RAIL_W;root.classList.toggle('rail',rail);
  const s=Math.min(1,w/(rail?1060:1200),h/BASE_H);
  root.classList.add('fit');
  app.style.width=(w/s)+'px';app.style.height=(h/s)+'px';
  app.style.transform=s<1?`scale(${s})`:'';
}
window.addEventListener('resize',fit);
if(window.ResizeObserver)new ResizeObserver(()=>fit()).observe(document.documentElement);
/* por si el entorno cambia el tamaño sin avisar: comprobación ligera cada segundo */
setInterval(()=>{if(window.innerWidth+'x'+window.innerHeight!==fitKey)fit();},1000);
fit();
setSync('local');
render();
connect();
setTimeout(coachDaily,800);
})();
