<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F5F2"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui;background:#F5F5F2}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><title>Mi Día a Día</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: clean white screen with flat, very rounded pastel data cards (mint, peach, sky, lilac), heavy black display type (Manrope), dark pill buttons and a lime accent; one-screen bento per section */
:root{
  --bg:#F7ECE7; --card:#FFFFFF; --card2:#F7F5F4; --line:#F0E9E6; --ink:#4B4347; --ink2:#958C90; --ink3:#CDC5C8;
  --fill:rgba(28,28,30,.07); --fill2:rgba(28,28,30,.04); --scrim:rgba(28,20,18,.32); --bar:rgba(255,255,255,.9);
  --shadow:0 1px 3px rgba(90,50,40,.04),0 16px 40px rgba(90,50,40,.07);
  --btn:#4B4347; --btn-tx:#FFFFFF; --on:#4B4347;
  /* pasteles de datos */
  --coral:#F2896F; --peach:#F6A88D; --mint:#8FD3B8; --sand:#DCC3B2; --sky:#8CC5F1; --rose:#F2A1BA; --lav:#A9A3F4; --butter:#F3C866; --teal:#7CC8C3;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0E10; --card:#1C1C1E; --card2:#262528; --line:rgba(255,255,255,.07); --ink:#E6DFE2; --ink2:#A29A9E; --ink3:#55545A;
  --fill:rgba(255,255,255,.09); --fill2:rgba(255,255,255,.05); --scrim:rgba(0,0,0,.6); --bar:rgba(28,28,30,.9); --shadow:none;
  --btn:#E6DFE2; --btn-tx:#141416; --on:#141416;
  --coral:#F59A82; --peach:#F7B39B; --mint:#9BDCC2; --sand:#E2CDBF; --sky:#9DD0F6; --rose:#F5AFC5; --lav:#B6B1F7; --butter:#F5D17E; --teal:#8FD7D2;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F0E10; --card:#1C1C1E; --card2:#262528; --line:rgba(255,255,255,.07); --ink:#E6DFE2; --ink2:#A29A9E; --ink3:#55545A;
  --fill:rgba(255,255,255,.09); --fill2:rgba(255,255,255,.05); --scrim:rgba(0,0,0,.6); --bar:rgba(28,28,30,.9); --shadow:none;
  --btn:#E6DFE2; --btn-tx:#141416; --on:#141416;
  --coral:#F59A82; --peach:#F7B39B; --mint:#9BDCC2; --sand:#E2CDBF; --sky:#9DD0F6; --rose:#F5AFC5; --lav:#B6B1F7; --butter:#F5D17E; --teal:#8FD7D2;
  color-scheme:dark;
}
/* tono legible de cada pastel para textos e iconos (mezcla con la tinta) */
*{--cx:color-mix(in srgb,var(--c,var(--ink)) 52%,var(--ink));--tint:color-mix(in srgb,var(--c,var(--ink)) 20%,var(--card))}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
button:disabled{opacity:.3;cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{display:flex;flex-direction:column;padding:26px 16px 16px;background:var(--card);overflow-y:auto;box-shadow:1px 0 0 var(--line)}
.brand{padding:0 8px 24px}
.brand b{display:block;font:800 22px/1.1 var(--display);letter-spacing:-.03em}
.brand b em{font-style:normal;color:var(--coral)}
.brand span{display:block;font-size:12px;color:var(--ink2);margin-top:5px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-i{display:flex;align-items:center;gap:11px;padding:4px 8px;border-radius:14px;color:var(--ink);font-weight:500}
.nav-i .ic{width:28px;height:28px;padding:5px;border-radius:10px;background:var(--tint);color:var(--cx);flex:none}
.nav-i:hover{background:var(--fill2)}
.nav-i[aria-current="page"]{background:var(--btn);color:var(--btn-tx);font-weight:600}
.nav-i[aria-current="page"] .ic{background:color-mix(in srgb,var(--c) 85%,var(--btn));color:var(--on)}
.nav-i em{margin-left:auto;font:700 11px var(--font);font-style:normal;color:var(--ink);background:var(--coral);border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.nav-i em:empty{display:none}
.nav-sep{height:1px;background:var(--line);margin:12px 8px}
.side-foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:12px}
.demo{background:color-mix(in srgb,var(--peach) 22%,var(--card));border-radius:18px;padding:14px;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:8px}
.demo b{font:700 15px var(--display);color:var(--ink);letter-spacing:-.02em}
.demo .row-b{display:flex;gap:6px;flex-wrap:wrap}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);padding:0 6px}
.sync .ic{flex:none}
.main{height:100%;overflow:hidden;min-width:0}
.page{height:100%;display:flex;flex-direction:column;gap:18px;padding:24px 30px;max-width:1480px;margin:0 auto}
.tabbar{display:none}
.m-only{display:none}

/* ---------- títulos ---------- */
.hd{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hd-l{min-width:0}
.eyebrow{display:block;font:600 11px/1.3 var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.lt{font:800 34px/1.05 var(--display);letter-spacing:-.035em;margin:6px 0 0;text-wrap:balance}
.lt em{font-style:normal;color:var(--ink2);font-weight:700}
.hd-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.quote{font:500 15px/1.4 var(--font);max-width:36ch;margin:0;color:var(--ink2);text-align:right}
.quote span{display:block;font:600 10.5px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin-top:6px}

/* ---------- paneles ---------- */
.view{flex:1;min-height:0;display:grid;gap:16px}
.card{background:var(--card);border-radius:24px;padding:18px 20px;box-shadow:var(--shadow);min-height:0;min-width:0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex:none}
.ch h3{font:700 18px/1.2 var(--display);margin:3px 0 0;letter-spacing:-.025em}
.cs{font-size:12.5px;color:var(--ink2)}
.scroll{flex:1;min-height:0;overflow-y:auto;margin-right:-8px;padding-right:8px;scrollbar-width:thin;scrollbar-color:var(--fill) transparent}
.scroll::-webkit-scrollbar{width:6px}
.scroll::-webkit-scrollbar-thumb{background:var(--fill);border-radius:3px}
.grow{flex:1;min-height:80px;display:flex;flex-direction:column}
.foot{font-size:12px;color:var(--ink2);margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{background:var(--card);border-radius:22px;padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);min-width:0}
.kpi>div{min-width:0}
.kpi .kv{font:700 26px/1.1 var(--num);letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kv small{font:500 13px var(--font);letter-spacing:0;color:var(--ink2)}
.kpi .ks{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:999px;font:600 13px/1 var(--font);background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.03);white-space:nowrap}
.btn:hover{background:var(--card2)}
.btn.primary{background:var(--btn);color:var(--btn-tx);box-shadow:none}
.btn.primary:hover{opacity:.88}
.btn.small{padding:7px 13px;font-size:12px}
.btn.soft{background:var(--tint);color:var(--ink);box-shadow:none}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.iconbtn:hover{background:var(--card2)}
.link{color:var(--ink);font-weight:600;font-size:13px;text-decoration:underline;text-decoration-color:var(--ink3);text-underline-offset:3px}
.seg{display:inline-flex;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-tx)}
.chk{width:22px;height:22px;border-radius:50%;border:1.6px solid var(--ink3);display:grid;place-items:center;flex:none;color:transparent;transition:background .15s,border-color .15s}
.chk.on{background:var(--c,var(--peach));border-color:var(--c,var(--peach));color:var(--on)}
.pill{display:inline-block;font:600 11px/1.5 var(--font);padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--pc,var(--ink3)) 26%,var(--card));color:color-mix(in srgb,var(--pc,var(--ink2)) 45%,var(--ink));white-space:nowrap}
.late{--pc:var(--coral)}

/* ---------- filas ---------- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);width:100%;min-height:44px}
.rows>.row:first-child{border-top:0}
button.row:hover .t{text-decoration:underline;text-decoration-color:var(--ink3);text-underline-offset:3px}
.row .main-t{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.row .r{color:var(--ink2);font-size:13px;display:flex;align-items:center;gap:6px;flex:none;text-align:right}
.row .chev{color:var(--ink3);flex:none}
.row.done .t{color:var(--ink3);text-decoration:line-through}
.empty{color:var(--ink2);font-size:13px;text-align:center;padding:18px 10px;background:var(--card2);border-radius:16px}
.subhd{font:600 11px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);padding:12px 0 4px;display:flex;justify-content:space-between;align-items:center;flex:none}

/* ---------- gráficos ---------- */
.ringc{position:relative;display:grid;place-items:center;flex:none}
.ringc .in{position:absolute;text-align:center;line-height:1.15}
.ringc .in b{display:block;font:700 26px var(--num);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ringc .in span{font-size:11.5px;color:var(--ink2)}
.pbar{height:7px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,var(--card));overflow:hidden;flex:none}
.pbar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,var(--lav)))}
.bars{position:relative;display:flex;gap:6px;flex:1;min-height:90px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.bwrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bwrap i{width:min(16px,60%);min-height:6px;border-radius:999px;background:color-mix(in srgb,var(--c) 38%,var(--card))}
.bcol:nth-child(even) .bwrap i{background:color-mix(in srgb,var(--lav) 34%,var(--card))}
.bcol.last .bwrap i{background:linear-gradient(180deg,var(--c),color-mix(in srgb,var(--c) 50%,var(--lav)))}
.bl{height:20px;line-height:20px;font-size:10.5px;color:var(--ink2);white-space:nowrap}
.goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink3);pointer-events:none}
.goal span{position:absolute;right:0;top:-18px;font-size:10.5px;font-weight:600;color:var(--ink2);background:var(--card);padding-left:4px}
.spark{display:block;width:100%;flex:none}
.hbars{display:flex;flex-direction:column;gap:6px}
.hb{display:grid;grid-template-columns:minmax(70px,auto) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb-l{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.hb-t{height:8px;border-radius:999px;background:var(--fill2);overflow:hidden}
.hb-t i{display:block;height:100%;border-radius:999px;background:var(--c)}
.hb-v{color:var(--ink2);font-size:12px}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;min-width:0}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.legend b{margin-left:auto;font-weight:600;color:var(--ink2);padding-left:10px}
.heat-wrap{display:flex;gap:6px;flex:1;min-height:90px}
.heat-l{display:grid;grid-template-rows:repeat(7,1fr);font-size:10px;color:var(--ink3);gap:4px}
.heat-l span{display:flex;align-items:center}
.heat{flex:1;display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px}
.heat i{border-radius:6px;background:var(--fill2)}
.heat i.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--fill2)}

/* ---------- Hoy ---------- */
.v-hoy{grid-template-columns:minmax(250px,290px) minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"date tiles tiles" "date prio week"}
.datecard{background:linear-gradient(165deg,color-mix(in srgb,var(--peach) 34%,var(--card)) 0%,color-mix(in srgb,var(--rose) 18%,var(--card)) 45%,color-mix(in srgb,var(--lav) 26%,var(--card)) 100%)}
.bigday{font:800 76px/.9 var(--num);letter-spacing:-.05em}
.dmon{font:600 11px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);margin-top:8px}
.minical{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.mc-w{font-size:10px;font-weight:600;color:var(--ink2);padding-bottom:4px}
.mc-d{position:relative;height:27px;width:27px;margin:auto;display:grid;place-items:center;border-radius:50%}
.mc-d.is-per{background:color-mix(in srgb,var(--coral) 55%,transparent);font-weight:700}
.mc-d.is-pred{box-shadow:inset 0 0 0 1.5px var(--coral)}
.mc-d.is-today{background:var(--btn);color:var(--btn-tx);font-weight:700}
.mc-d em{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.mc-d em i{width:4px;height:4px;border-radius:50%}
.mc-lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2)}
.mc-lg span{display:flex;align-items:center;gap:5px}
.mc-lg i{width:7px;height:7px;border-radius:50%}
.look{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--card);text-align:left;width:100%;margin-top:auto;color:var(--ink);box-shadow:0 4px 14px rgba(90,50,40,.06)}
.look>.ic{color:var(--ink2);flex:none}
.look .t{font-weight:600;font-size:13px}
.look .s{font-size:12px;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tiles{grid-area:tiles;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mt-tile{background:color-mix(in srgb,var(--c) 26%,var(--card));border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0;text-align:left;transition:transform .2s ease,box-shadow .2s ease}
.mt-tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.mt-h{display:flex;justify-content:space-between;align-items:center;color:var(--ink);font:600 12.5px var(--font)}
.mt-h .ic{width:28px;height:28px;padding:6px;border-radius:50%;background:var(--card);color:var(--ink)}
.mt-v{font:700 27px/1.15 var(--num);letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt-v small{font:500 13px var(--font);letter-spacing:0;color:color-mix(in srgb,var(--ink) 60%,transparent)}
.mt-s{font-size:12px;color:color-mix(in srgb,var(--ink) 62%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:8px}
.mt-tile .pbar{background:color-mix(in srgb,var(--card) 70%,transparent);margin-top:auto}
.mt-tile .pbar>i{background:var(--ink)}
.dots7{display:flex;gap:5px;margin-top:auto}
.dots7 i{flex:1;height:7px;border-radius:999px;background:color-mix(in srgb,var(--card) 70%,transparent)}
.dots7 i.on{background:var(--ink)}
.segbar{display:flex;gap:4px;margin-top:auto;height:7px}
.segbar i{flex:1;border-radius:999px;background:color-mix(in srgb,var(--card) 70%,transparent)}
.segbar i.on{background:var(--ink)}
.cybar{position:relative;height:7px;border-radius:999px;background:color-mix(in srgb,var(--card) 70%,transparent);margin-top:auto}
.cybar b,.cybar u{position:absolute;top:0;bottom:0;border-radius:999px}
.cybar b{background:var(--coral)}
.cybar u{background:var(--sky)}
.cybar s{position:absolute;top:-4px;width:4px;height:15px;border-radius:2px;background:var(--ink)}
.wchart{position:relative;display:flex;gap:6px;flex:1;min-height:90px}
.wc-col{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.wc-bar{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.wc-bar i{width:min(16px,60%);min-height:6px;border-radius:999px;background:color-mix(in srgb,var(--lav) 36%,var(--card))}
.wc-col:nth-child(odd) .wc-bar i{background:color-mix(in srgb,var(--peach) 42%,var(--card))}
.wc-col.now .wc-bar i{background:linear-gradient(180deg,var(--peach),var(--lav))}
.wc-dot{width:7px;height:7px;margin-top:8px;border-radius:50%;background:var(--fill)}
.wc-dot.on{background:var(--ink)}
.wc-l{height:18px;line-height:18px;font-size:10.5px;color:var(--ink2)}
.wc-col.now .wc-l{color:var(--ink);font-weight:700}
.ev{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.ev:first-child{border-top:0}
.ev-d{width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--c) 26%,var(--card));color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.ev-d b{font:700 16px var(--num);letter-spacing:-.02em}
.ev .main-t,.apt .main-t{flex:1;min-width:0;display:flex;flex-direction:column}
.ev .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .s{font-size:12px;color:var(--ink2)}
.ev-r{font-size:12px;color:var(--ink2);flex:none}

/* ---------- Gimnasio ---------- */
.v-gym{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);grid-template-areas:"kpi kpi kpi" "today chart hist" "routines heat hist"}
.days{display:flex;gap:3px;flex:none}
.days i{font-style:normal;font-size:9px;font-weight:700;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;color:var(--ink3);background:var(--fill2)}
.days i.on{background:var(--c);color:var(--on)}
.ex{display:grid;grid-template-columns:1fr auto;column-gap:14px}
.ex div{padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.ex div:nth-child(-n+2){border-top:0}
.ex .exr{text-align:right;color:var(--ink2);font-variant-numeric:tabular-nums}
.r-name{font:800 22px/1.15 var(--display);letter-spacing:-.03em;margin:0}
.hint{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink2);background:color-mix(in srgb,var(--rose) 18%,var(--card));border-radius:16px;padding:10px 12px;flex:none}
.hint .ic{color:var(--ink);flex:none}
.hint b{color:var(--ink)}

/* ---------- Alimentación ---------- */
.v-food{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"sum meals week" "water meals macro"}
.daynav{display:flex;align-items:center;gap:8px}
.daynav div{min-width:120px;text-align:center;font-weight:600;font-size:13px}
.sumrow{display:flex;align-items:center;gap:20px;flex:1;min-height:0}
.sumrow .side-i{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.kvl{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;margin-bottom:6px}
.kvl span{color:var(--ink2)}
.waterrow{display:flex;align-items:center;gap:18px;flex:1;min-height:0}
.vessel{position:relative;width:96px;height:100%;max-height:150px;min-height:110px;border-radius:48px 48px 30px 30px;overflow:hidden;flex:none;background:color-mix(in srgb,var(--sky) 14%,var(--card))}
.vessel .liq{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,color-mix(in srgb,var(--sky) 75%,var(--card)),color-mix(in srgb,var(--lav) 70%,var(--card)));transition:height .4s ease}
.vessel .vv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.vessel .vv b{font:700 22px var(--num);letter-spacing:-.03em}
.vessel .vv span{font-size:11px;color:var(--ink2)}
.glasses{display:flex;gap:3px;flex-wrap:wrap}
.glass{width:28px;height:34px;display:grid;place-items:center;color:var(--ink3);border-radius:10px}
.glass:hover{background:var(--fill2)}
.glass svg path{fill:transparent}
.glass.on{color:color-mix(in srgb,var(--sky) 60%,var(--ink))}
.glass.on svg path{fill:color-mix(in srgb,var(--sky) 55%,transparent)}
.meal-h{display:flex;align-items:center;justify-content:space-between;padding:10px 0 2px;border-top:1px solid var(--line)}
.meal-h:first-child{border-top:0;padding-top:0}
.meal-h b{font:700 15px var(--display);letter-spacing:-.02em}
.meal-h span{color:var(--ink2);font-size:12px;margin-left:6px}
.meal-h .link{text-decoration:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card2)}
.meal{display:flex;justify-content:space-between;gap:12px;padding:6px 0;width:100%;text-align:left;font-size:13.5px}
.meal .main-t{display:flex;flex-direction:column;min-width:0}
.meal:hover .t{text-decoration:underline;text-decoration-color:var(--ink3)}
.meal .s{font-size:12px;color:var(--ink2)}
.meal .r{color:var(--ink2);font-size:12.5px;flex:none;font-variant-numeric:tabular-nums}
.meal-none{font-size:12.5px;color:var(--ink3);padding:4px 0 6px}

/* ---------- Ropa ---------- */
.v-ropa{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"week week week" "closet colors cats"}
.week{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:10px;overflow-x:auto}
.dcard{border-radius:20px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-height:128px;background:var(--card2)}
.dcard.today{background:color-mix(in srgb,var(--peach) 30%,var(--card))}
.dcard:hover{box-shadow:inset 0 0 0 1.5px var(--ink3)}
.dc-d{font:600 10.5px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.dcard.today .dc-d{color:var(--ink)}
.dc-n{font:800 24px/1 var(--num);letter-spacing:-.03em}
.dc-o{font-size:11px;font-weight:700;color:var(--ink)}
.dc-i{font-size:11.5px;color:var(--ink2);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.dc-empty{margin-top:auto;font-size:11.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:4px}
.sws{display:flex;justify-content:center;margin:2px 0}
.sw{width:15px;height:15px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2),0 0 0 1.5px var(--card);flex:none}
.sws .sw+.sw{margin-left:-4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:var(--card2);font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-tx)}
.donutrow{display:flex;align-items:center;gap:14px;flex:1;min-height:0;flex-wrap:nowrap}
.donutrow .legend{flex:1;min-width:0}
.donutrow .legend div{white-space:nowrap}

/* ---------- Salud ---------- */
.v-salud{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);grid-template-areas:"kpi kpi kpi" "doses adh appts" "doses meds appts"}
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:46px 22px 1fr;gap:10px;align-items:start;padding:8px 0;position:relative}
.tl-i::before{content:"";position:absolute;left:66px;top:32px;bottom:-8px;width:2px;border-radius:2px;background:var(--fill)}
.tl-i:last-child::before{display:none}
.tl-t{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px}
.tl-i .t{font-weight:600}
.tl-i .s{font-size:12px;color:var(--ink2)}
.tl-i.done .t{color:var(--ink3);text-decoration:line-through}
.mx{display:flex;flex-direction:column;gap:6px;font-size:12px}
.mx-row{display:grid;grid-template-columns:minmax(90px,130px) repeat(14,1fr);gap:4px;align-items:center}
.mx-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.mx-l small{color:var(--ink2);font-weight:400}
.mx-row i{height:16px;border-radius:999px;background:var(--fill2)}
.mx-row i.ok{background:linear-gradient(180deg,var(--sky),var(--lav))}
.mx-row i.miss{background:color-mix(in srgb,var(--coral) 28%,var(--card))}
.mx-row i.fut{box-shadow:inset 0 0 0 1.5px var(--fill);background:transparent}
.mx-row i.na{background:transparent}
.mx-h span{font-size:9.5px;color:var(--ink3);text-align:center;font-weight:600}
.apt{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.apt:first-child{border-top:0}
.apt:hover .t{text-decoration:underline;text-decoration-color:var(--ink3)}
.apt .t{font-weight:600}
.apt .s{font-size:12px;color:var(--ink2)}

/* ---------- Ciclo ---------- */
.v-ciclo{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"ring cal stats" "today cal stats"}
.cyring{display:flex;flex-direction:column;align-items:center;gap:14px;flex:1;min-height:0;justify-content:center}
.cyfacts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.cyfacts>div{background:var(--card2);border-radius:16px;padding:10px 12px}
.cyfacts .k{font:600 10.5px var(--font);letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.cyfacts .v{font:700 16px/1.3 var(--display);letter-spacing:-.02em;margin-top:2px}
.cyfacts .v small{font:500 12px var(--font);color:var(--ink2);letter-spacing:0}
.cal-h{display:flex;align-items:center;justify-content:space-between;flex:none;gap:10px}
.cal-h b{font:800 22px var(--display);letter-spacing:-.03em;text-transform:capitalize}
.cal-h .nav-b{display:flex;gap:6px;align-items:center}
.cal{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:3px 0;text-align:center}
.cal .dw{font-size:10.5px;font-weight:700;color:var(--ink2);align-self:end;padding-bottom:4px}
.cd{position:relative;display:grid;place-items:center;min-height:30px}
.cd span{position:relative;z-index:1;width:min(36px,100%);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-variant-numeric:tabular-nums;font-size:14px;font-weight:500}
.cd:hover span{background:var(--fill2)}
.cd.fert::before{content:"";position:absolute;inset:18% 0;background:color-mix(in srgb,var(--sky) 22%,var(--card))}
.cd.ov span{background:var(--sky);font-weight:700;color:var(--on)}
.cd.pred span{box-shadow:inset 0 0 0 1.5px var(--coral)}
.cd.per::before{content:"";position:absolute;inset:18% 0;background:color-mix(in srgb,var(--coral) 30%,var(--card))}
.cd.per span{background:var(--coral);color:var(--on);font-weight:700}
.cd.today span{box-shadow:inset 0 0 0 2px var(--ink);font-weight:800}
.cd i{position:absolute;z-index:2;bottom:1px;width:4px;height:4px;border-radius:50%;background:var(--lav)}
.cal-lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);flex:none}
.cal-lg span{display:flex;align-items:center;gap:6px}
.cal-lg i{width:11px;height:11px;border-radius:50%;display:inline-block}
.switch{appearance:none;-webkit-appearance:none;width:48px;height:29px;border-radius:999px;background:var(--fill);position:relative;transition:background .2s;flex:none;margin:0 0 0 auto;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .2s}
.switch:checked{background:var(--coral)}
.switch:checked::after{transform:translateX(19px)}

/* ---------- Formación ---------- */
.v-forma{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto minmax(0,1.25fr) minmax(0,1fr);grid-template-areas:"kpi kpi kpi" "courses courses tasks" "chart donut tasks"}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
.course{border-radius:20px;padding:10px 13px;background:color-mix(in srgb,var(--c) 18%,var(--card));display:flex;flex-direction:column;gap:7px}
.course h4{font:700 16px/1.25 var(--display);letter-spacing:-.02em;margin:0}
.course .s{font-size:12px;color:var(--ink2)}
.course .pbar{background:color-mix(in srgb,var(--card) 75%,transparent)}
.course .pbar>i{background:var(--ink)}
.course .btn{background:var(--card);box-shadow:none}
.course-f{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--ink2);flex-wrap:wrap}

/* ---------- Objetivos ---------- */
.v-obj{grid-template-columns:minmax(0,1fr) minmax(250px,300px);grid-template-rows:minmax(0,1fr);grid-template-areas:"goals side"}
.gwrap{grid-area:goals;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-content:start;padding:2px 6px 8px 2px}
.goal-c{background:var(--card);border-radius:24px;padding:14px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;overflow:hidden}
.goal-top{display:flex;gap:14px;align-items:flex-start}
.goal-top .main-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.goal-c h4{font:700 17px/1.25 var(--display);letter-spacing:-.02em;margin:0}
.goal-c .s{font-size:12px;color:var(--ink2)}
.why{font:400 13.5px/1.45 var(--font);color:var(--ink2)}
.step{display:flex;align-items:center;gap:10px;padding:4px 0;border-top:1px solid var(--line);font-size:13.5px;width:100%;text-align:left}
.step.done span:last-child{color:var(--ink3);text-decoration:line-through}
.step .chk{width:20px;height:20px}
.road{display:flex;flex-direction:column;position:relative;padding-left:16px}
.road::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--fill)}
.road-i{position:relative;padding:6px 0;display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.road-i::before{content:"";position:absolute;left:-16px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--card)}
.road-i span{color:var(--ink2);flex:none}
.road-i b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Ajustes ---------- */
.v-aj{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr);align-items:start}
.v-aj .card{grid-area:auto!important}
.set-in{border:0;background:var(--card2);border-radius:10px;padding:7px 10px;text-align:right;font:inherit;font-weight:600;color:var(--ink);width:90px;outline:none}
.set-in.wide{width:150px}
.set-in:focus{box-shadow:inset 0 0 0 1.5px var(--ink)}
.del{color:color-mix(in srgb,var(--coral) 55%,var(--ink));font-weight:600}
.del.armed{background:color-mix(in srgb,var(--coral) 20%,transparent);border-radius:12px;padding-inline:10px}

/* ---------- hojas (formularios) ---------- */
#sheetRoot{position:fixed;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .2s ease;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{background:var(--bg);width:min(540px,100%);max-height:min(88vh,860px);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(40,20,15,.25);animation:rise .3s cubic-bezier(.2,.9,.3,1)}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:16px 18px;background:var(--card)}
.sheet-h h3{margin:0;font:700 17px var(--display);letter-spacing:-.02em;text-align:center;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-h .btn{justify-self:end}
.sheet-h .link{justify-self:start;text-decoration:none;color:var(--ink2)}
.sheet-b{overflow-y:auto;padding:6px 18px 26px}
.sheet-err{color:color-mix(in srgb,var(--coral) 55%,var(--ink));font-size:13.5px;font-weight:600;margin:12px 4px 0}
.fgroup{background:var(--card);border-radius:20px;margin-top:14px;overflow:hidden}
.fgroup-hd{font:600 11px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);padding:18px 6px 0}
.f{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 16px}
.f+.f{border-top:1px solid var(--line)}
.f>span{flex:none;font-weight:500}
.f input:not([type="checkbox"]),.f select{flex:1;min-width:0;text-align:right;border:0;background:transparent;font:inherit;color:var(--ink2);padding:6px 0;outline:none}
.f input:focus,.f select:focus{color:var(--ink)}
.f input[type="date"],.f input[type="time"]{flex:none;background:var(--card2);border-radius:10px;padding:7px 10px;color:var(--ink);text-align:center;font-weight:500}
.f.col{flex-direction:column;align-items:stretch;gap:9px;padding:13px 16px}
.fl{font:600 11px var(--font);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.fh{font-size:12px;color:var(--ink2)}
.f textarea{width:100%;border:0;background:var(--card2);border-radius:14px;padding:11px 13px;font:inherit;color:var(--ink);resize:vertical;outline:none;line-height:1.55}
.del-row{display:block;width:100%;text-align:center;padding:15px;margin-top:14px;border-radius:20px;background:var(--card);color:color-mix(in srgb,var(--coral) 55%,var(--ink));font-weight:600}
.del-row.armed{background:color-mix(in srgb,var(--coral) 22%,var(--card))}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--btn);color:var(--btn-tx);padding:12px 22px;border-radius:999px;font-weight:600;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}

/* ---------- Finanzas ---------- */
.v-fin{grid-template-columns:minmax(0,1.05fr) minmax(0,1.1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) minmax(0,1fr);grid-template-areas:"kpi kpi kpi" "cal spend advice" "cal recent advice"}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13.5px}
.amt.in{color:color-mix(in srgb,var(--mint) 40%,var(--ink))}
.bud{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0;align-self:center;max-height:100%}
.bud-r{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:12.5px}
.bud-l{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bud-l i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.bud-v{font-weight:600}
.bud-v small{font-weight:500;color:var(--ink2)}
.bud-t{grid-column:1/-1;height:5px;border-radius:999px;background:var(--fill2);overflow:hidden}
.bud-t i{display:block;height:100%;border-radius:999px;background:var(--c)}
.tips{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.tip{display:flex;gap:10px;padding:9px 12px;border-radius:16px;background:color-mix(in srgb,var(--c) 16%,var(--card));flex:none}
.tip>i{width:4px;flex:none;border-radius:4px;background:var(--c)}
.tip b{display:block;font-size:13px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.tips.clamp .tip span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tip span{display:block;font-size:11.5px;color:var(--ink2);line-height:1.38;margin-top:2px}

/* ---------- Finanzas · cuentas ---------- */
.v-facc{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"accs accs accs" "flow moves transfers"}
.accs{grid-area:accs;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.acc{border-radius:22px;padding:13px 15px;background:color-mix(in srgb,var(--c) 24%,var(--card));text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0;transition:transform .2s ease,box-shadow .2s ease}
.acc:hover{transform:translateY(-2px)}
.acc.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.acc-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.acc-n{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-r{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--card) 70%,transparent);flex:none}
.acc-b{font:700 23px/1.15 var(--num);letter-spacing:-.03em;margin-top:2px}
.acc-p{font-size:11.5px;color:color-mix(in srgb,var(--ink) 60%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-s{font-size:11.5px;color:color-mix(in srgb,var(--ink) 75%,transparent);line-height:1.3;min-height:30px}
.acc .pbar{background:color-mix(in srgb,var(--card) 70%,transparent);margin-top:auto}
.acc .pbar>i{background:var(--c)}
.acc .pill{align-self:flex-start;margin-top:auto}
.acc-add{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink3);align-items:center;justify-content:center;color:var(--ink2);font-weight:600;font-size:12.5px;gap:6px}
.v-fin .row .t,.v-fin .row .s,.v-facc .row .t,.v-facc .row .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-fin .row .main-t,.v-facc .row .main-t{min-width:0}
.split{display:flex;height:22px;border-radius:999px;overflow:hidden;gap:2px;flex:none}
.split i{display:block;min-width:4px}

/* ---------- Finanzas · asistente ---------- */
.v-fsim{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"chat side"}
.chat-log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px 6px 2px 0;scrollbar-width:thin;scrollbar-color:var(--fill) transparent}
.msg{max-width:86%;padding:10px 14px;border-radius:20px;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere}
.msg p{margin:0}
.msg p+p{margin-top:7px}
.msg ul{margin:6px 0 2px;padding-left:18px}
.msg li+li{margin-top:3px}
.msg.u{align-self:flex-end;background:var(--btn);color:var(--btn-tx);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:color-mix(in srgb,var(--teal) 15%,var(--card));border-bottom-left-radius:6px}
.typing{color:var(--ink2);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.chat-hi{display:flex;flex-direction:column;gap:9px;padding:4px 2px}
.chat-hi b{font:700 18px/1.25 var(--display);letter-spacing:-.02em}
.chat-hi span{color:var(--ink2);font-size:13px;max-width:62ch}
.chat-in{display:flex;gap:8px;align-items:flex-end;flex:none}
.chat-in textarea{flex:1;resize:none;border:0;background:var(--card2);border-radius:18px;padding:11px 14px;font:inherit;color:var(--ink);min-height:44px;max-height:96px;outline:none;line-height:1.45}
.chat-in textarea:focus{box-shadow:inset 0 0 0 1.5px var(--ink3)}
.chat-in .btn{height:44px}
.sugs{flex:none;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.sugs .chip{white-space:nowrap;font-size:12px}
.simpanel{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0}
.facts .kvl{margin-bottom:5px}
.simt{font-weight:700;font-size:13px;margin-bottom:4px}
.simsvg{width:100%;height:110px;display:block;flex:none}
.simx{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink2)}
.simleg{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);margin-top:4px}
.simleg span{display:flex;align-items:center;gap:6px}
.simleg .ln{display:inline-block;width:16px;height:3px;border-radius:2px;background:var(--teal)}
.simleg .ln.base{background:none;border-top:2px dashed var(--ink3);height:0}

/* ---------- asistente lateral ---------- */
#agentRoot{position:fixed;top:0;right:0;bottom:0;z-index:55;width:min(430px,100%);padding:14px;pointer-events:none}
.agent{pointer-events:auto;height:100%;background:var(--card);border-radius:26px;box-shadow:0 24px 70px rgba(40,20,15,.22),0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px;padding:16px;animation:slidein .25s ease}
@keyframes slidein{from{transform:translateX(30px);opacity:0}}
.ag-h{display:flex;align-items:center;gap:10px;flex:none}
.ag-ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--peach) 55%,var(--card)),color-mix(in srgb,var(--lav) 55%,var(--card)));color:var(--ink);flex:none}
.ag-h b{display:block;font:700 17px var(--display);letter-spacing:-.02em}
.ag-a{margin-left:auto;display:flex;gap:6px;align-items:center}
.agent .msg.a{background:color-mix(in srgb,var(--c) 16%,var(--card))}
.agent-b{background:linear-gradient(135deg,color-mix(in srgb,var(--peach) 42%,var(--card)),color-mix(in srgb,var(--lav) 42%,var(--card)));box-shadow:none;color:var(--ink)}
.agent-b:hover{filter:brightness(.97)}
@media (max-width:599px){#agentRoot{width:100%;padding:0}.agent{border-radius:0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}}

/* ---------- Hoy: semana y mes ---------- */
.v-hoy.wide{grid-template-columns:minmax(250px,290px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"date main"}
button.mc-d:hover{background:var(--fill)}
.mc-d.in-wk{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.mc-d.is-sel{box-shadow:inset 0 0 0 2px var(--ink)}
.dd-ic{width:30px;height:30px;border-radius:10px;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--c) 28%,var(--card));color:var(--ink);flex:none}
.row.dd .t,.row.dd .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-wrap{flex:1;min-height:0;overflow:hidden}
.wkt{width:100%;height:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;font-variant-numeric:tabular-nums}
.wkt th,.wkt td{padding:5px 4px;text-align:center;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkt thead th{border-top:0;padding-bottom:8px}
.wkt thead th:first-child{width:138px}
.wkt .tot{width:96px;font-weight:700}
.wkt tbody th{text-align:left;font-weight:600}
.wkt tbody th .dd-ic{width:24px;height:24px;border-radius:8px;margin-right:8px;vertical-align:middle}
.wkt td.sel{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.wkt small{font-size:10.5px;color:var(--ink2);font-weight:500}
.wk-d{display:flex;flex-direction:column;align-items:center;gap:1px;margin:auto;padding:5px 9px;border-radius:12px;font-size:11px;color:var(--ink2)}
.wk-d b{font:700 16px var(--num);color:var(--ink)}
.wk-d:hover{background:var(--fill2)}
.wk-d.is-t{background:var(--btn)}
.wk-d.is-t span,.wk-d.is-t b{color:var(--btn-tx)}
.wk-d.is-s{box-shadow:inset 0 0 0 2px var(--ink)}
.mut{color:var(--ink3)}
.warn{color:color-mix(in srgb,var(--coral) 60%,var(--ink))}
.dotv{display:inline-block;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--c);margin-right:4px;vertical-align:middle}
.dotv.on{background:var(--c);box-shadow:none}
.dotv.per{background:var(--rose);box-shadow:none}
.dotv.sym{background:var(--lav);box-shadow:none}
.mkpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;flex:none}
.mk{border-radius:16px;padding:10px 12px;background:color-mix(in srgb,var(--c) 22%,var(--card));display:flex;flex-direction:column;gap:1px;min-width:0}
.mk span{font-size:11.5px;font-weight:600}
.mk b{font:700 20px/1.2 var(--num);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk small{font-size:11px;color:color-mix(in srgb,var(--ink) 60%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcal{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:5px}
.mcal .dw{font-size:10.5px;font-weight:700;color:var(--ink2);text-align:center;align-self:end}
.mcell{border-radius:12px;background:var(--card2);padding:5px 7px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:0;overflow:hidden}
.mcell:hover{box-shadow:inset 0 0 0 1.5px var(--ink3)}
.mcell.is-t{background:color-mix(in srgb,var(--peach) 30%,var(--card))}
.mcell.is-s{box-shadow:inset 0 0 0 2px var(--ink)}
.mcell.fut{opacity:.6}
.mc-n{font-weight:700;font-size:12.5px;line-height:1.1}
.mc-dots{display:flex;gap:3px;min-height:6px}
.mc-dots i{width:6px;height:6px;border-radius:50%}
.mc-bar{width:100%;height:4px;border-radius:2px;background:var(--fill2);overflow:hidden;margin-top:auto;flex:none}
.mc-bar i{display:block;height:100%;background:var(--mint)}
.mc-eur{font-size:10px;color:var(--ink2);line-height:1.1}
.mc-lg i.bar{width:14px;height:4px;border-radius:2px;background:var(--mint)}
button.wc-col{cursor:pointer}

/* ---------- Alimentación · menú semanal ---------- */
.v-menu{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"strip strip" "meals info"}
.mstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.mday{background:var(--card);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-align:left;box-shadow:var(--shadow);min-width:0}
.mday:hover{transform:translateY(-1px)}
.mday.sel{box-shadow:inset 0 0 0 2px var(--ink),var(--shadow)}
.md-d{font-size:11.5px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.mday.is-t .md-d{color:var(--ink)}
.mday b{font:700 18px/1.2 var(--num);letter-spacing:-.02em}
.mday b small{font:500 11px var(--font);color:var(--ink2);letter-spacing:0}
.md-p{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-p i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.mrow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .ev-d{width:54px;font-size:12px;font-weight:700;letter-spacing:0}
.mchips{display:flex;gap:4px;margin-top:3px;overflow:hidden;flex-wrap:nowrap}
.mchips .pill{font-size:10.5px}
.minfo{margin:0;font-size:13px;color:var(--ink2);line-height:1.45}
.mtips{margin:0;padding-left:18px;font-size:12.5px;line-height:1.45}
.mtips li+li{margin-top:4px}
.mnut{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px}
.mn{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3)}
.mn i{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink3);flex:none}
.mn.on{color:var(--ink)}
.mn.on i{background:var(--mint);box-shadow:none}
.mdetail p{margin:6px 0;font-size:13.5px;line-height:1.5}

/* ---------- Gimnasio · programa ---------- */
.v-gprog{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"strip strip" "sess pside"}
.pstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.pday{background:var(--card);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;text-align:left;box-shadow:var(--shadow);min-width:0;border-top:4px solid var(--c)}
.pday.sel{box-shadow:inset 0 0 0 2px var(--ink),var(--shadow)}
.pday.is-t .md-d{color:var(--ink)}
.pday b{font-size:12.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px}
.pexs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:1;min-height:0;align-content:start}
.pex{border-radius:14px;background:var(--card2);padding:9px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;text-align:left;min-width:0}
.pex:hover{box-shadow:inset 0 0 0 1.5px var(--ink3)}
.pex-n{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pex-r{font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.pex-c{grid-column:1/-1;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pph,.pbtns{flex:none;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- coach ---------- */
.coach .cblk{border-radius:16px;padding:10px 13px;margin-top:10px}
.coach .cblk.si{background:color-mix(in srgb,var(--mint) 22%,var(--card))}
.coach .cblk.no{background:color-mix(in srgb,var(--coral) 17%,var(--card))}
.coach .cblk b{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.coach .cblk p{margin:4px 0 0;font-size:13.5px;line-height:1.5}
.coach .cfrase{font:700 17px/1.35 var(--display);letter-spacing:-.015em;margin:14px 0 6px}
.coach a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}

/* ---------- fichas de ejercicio ---------- */
.exsheet{display:flex;flex-direction:column}
.exframes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exfr{margin:0;background:var(--card);border-radius:18px;padding:6px 6px 8px;box-shadow:var(--shadow);text-align:center;min-width:0}
.exframes.wide{grid-template-columns:minmax(0,1fr)}
.exframes.wide .exfr svg{max-height:none}
.exfr.big{grid-column:1/-1;max-width:300px;justify-self:center;width:100%}
.exfr svg{width:100%;height:auto;max-height:190px;display:block;margin:0 auto}
.exfr figcaption{font-size:11.5px;font-weight:700;color:var(--ink2);margin-top:2px}
.exfr .fnear{stroke:var(--ink)}
.exfr .ffar{stroke:color-mix(in srgb,var(--ink) 38%,var(--card))}
.exfr .fhead{fill:var(--ink)}
.exfr .fp{fill:color-mix(in srgb,var(--sand) 55%,var(--card))}
.exfr .fpl{stroke:color-mix(in srgb,var(--sand) 80%,var(--ink) 10%)}
.exfr .fpd{fill:var(--coral);stroke:var(--coral)}
.exfr .fc{stroke:var(--ink3);stroke-dasharray:3 2}
.exfr .ffloor{stroke:color-mix(in srgb,var(--ink) 14%,var(--card))}
.exfr .farr{stroke:color-mix(in srgb,var(--teal) 75%,var(--ink));fill:none}
.exfr .farh{fill:color-mix(in srgb,var(--teal) 75%,var(--ink))}
.exctl{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.exctl .cs{font-size:11.5px;color:var(--ink2)}
.mmap{display:grid;grid-template-columns:76px 76px minmax(0,1fr);gap:10px;align-items:center;background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:var(--shadow)}
.mmap figure{margin:0;text-align:center}
.mmap svg{width:100%;height:auto;display:block}
.mmap figcaption{font-size:10.5px;color:var(--ink2);font-weight:700}
.mmap .mb{fill:color-mix(in srgb,var(--ink) 9%,var(--card))}
.mmap .m0{fill:color-mix(in srgb,var(--ink) 15%,var(--card))}
.mmap .mp{fill:var(--coral)}
.mmap .ms{fill:color-mix(in srgb,var(--peach) 80%,var(--card))}
.mleg{display:flex;flex-direction:column;gap:8px;font-size:12.5px;line-height:1.4}
.mleg div{display:flex;gap:8px;align-items:flex-start}
.mleg i{flex:none;width:11px;height:11px;border-radius:4px;margin-top:3px}
.mleg i.mp{background:var(--coral)}
.mleg i.ms{background:color-mix(in srgb,var(--peach) 80%,var(--card))}
.mtips.okl li::marker{content:'✓  ';color:color-mix(in srgb,var(--teal) 75%,var(--ink))}
.mtips.kol li::marker{content:'✕  ';color:var(--coral)}
.exrow{width:100%;text-align:left}
.exrow .tq{flex:none;color:var(--ink2);display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700}
@media (max-width:420px){.mmap{grid-template-columns:64px 64px}.mleg{grid-column:1/-1}}

.exlink{all:unset;cursor:pointer;text-decoration:underline dotted color-mix(in srgb,var(--ink) 35%,transparent);text-underline-offset:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.exlink:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.exbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.exbar .seg button{font-size:12px}
.exhint{margin:8px 0 2px;font-size:11.5px;color:var(--ink2)}
.errc{background:var(--card);border-radius:20px;padding:12px;box-shadow:var(--shadow);margin-top:10px}
.errt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin-bottom:8px;flex-wrap:wrap}
.errt span{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;background:color-mix(in srgb,var(--coral) 22%,var(--card));color:var(--ink)}
.errt em{font-style:normal;font-weight:600;font-size:11px;color:var(--ink2);margin-left:auto}
.errc .exfr{box-shadow:none;background:var(--card2)}
.errc .exfr.good{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--teal) 70%,var(--card))}
.errc .exfr.bad{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--coral) 75%,var(--card))}
.errc .exfr.good figcaption{color:color-mix(in srgb,var(--teal) 60%,var(--ink))}
.errc .exfr.bad figcaption{color:color-mix(in srgb,var(--coral) 70%,var(--ink))}
.errfix{margin:10px 2px 0;font-size:12.5px;line-height:1.5}
.exfr .fmark{fill:color-mix(in srgb,var(--coral) 18%,transparent);stroke:var(--coral);stroke-width:2;stroke-dasharray:4 3}
.exfr .fguide{stroke:color-mix(in srgb,var(--teal) 70%,var(--card));stroke-dasharray:4 4}
.exfr .ffoot{fill:color-mix(in srgb,var(--ink) 38%,var(--card))}
.exfr .ftxt.sp{font-size:8.5px;font-weight:700;fill:var(--ink)}
.exfr .ftxt{font:600 9px var(--font);fill:var(--ink2)}
/* ---------- fotos ---------- */
.thumb{display:inline-grid;place-items:center;flex:none;border-radius:12px;background:var(--card2) center/cover no-repeat;color:color-mix(in srgb,var(--ink) 35%,transparent)}
.dot{display:inline-grid;place-items:center;overflow:hidden;border-radius:50%;background:var(--card2) center/cover no-repeat;box-shadow:0 0 0 2px var(--card);flex:none}
.dots{display:flex;justify-content:center;margin:2px 0}
.dots .dot+.dot{margin-left:-8px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:10px 8px}
.gal-i{display:flex;flex-direction:column;gap:5px;text-align:left;min-width:0}
.gal-i .ph{aspect-ratio:1;border-radius:14px;background:var(--card2) center/cover no-repeat;display:grid;place-items:center;color:color-mix(in srgb,var(--ink) 30%,transparent);transition:transform .2s ease}
.gal-i:hover .ph{transform:scale(1.02)}
.gal-i .t{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gal-i .s{font-size:11.5px;color:var(--ink2);margin-top:-3px}
.datecard{position:relative}
.cover{position:relative;margin:-18px -20px 0;min-height:150px;background:center/cover no-repeat;padding:16px 20px;display:flex;flex-direction:column;justify-content:flex-end;color:#FFFFFF;flex:none}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,12,0) 25%,rgba(20,14,12,.55))}
.cover>*{position:relative}
.cover .eyebrow,.cover .dmon{color:rgba(255,255,255,.88)}
.cover .bigday{font-size:62px}
.cover-btn{position:absolute;top:12px;right:12px;z-index:3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.g-cover{margin:-14px -18px 2px;height:76px;background:center/cover no-repeat;flex:none}
.ph-field{display:flex;gap:14px;align-items:center}
.ph-prev{width:88px;height:88px;border-radius:20px;background:var(--card2) center/cover no-repeat;display:grid;place-items:center;color:var(--ink3);flex:none}
.ph-act{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.ph-act label{cursor:pointer}
.ph-act .row-b{display:flex;gap:6px;flex-wrap:wrap}
.chip .dot{width:22px;height:22px;margin:-3px 0 -3px -7px;box-shadow:none}

.gal-i .t{font-size:11px}
.gal.compact{grid-template-columns:repeat(5,minmax(0,1fr))}
.gal.compact .gal-i .t{display:none}
.gal-more{aspect-ratio:1;border-radius:14px;background:var(--card2);display:grid;place-items:center;text-align:center;font-weight:700;font-size:13px;color:var(--ink2);line-height:1.2}
.gal-more:hover{background:var(--fill)}
.more-row{display:block;width:100%;text-align:center;padding:9px;margin-top:4px;border-radius:12px;background:var(--card2);font-weight:600;font-size:12.5px;color:var(--ink2)}
.more-row:hover{background:var(--fill)}
.demo-chip{display:none}
/* barra lateral estrecha (solo iconos) en ventanas de menos de 1100 px */
html.rail .app{grid-template-columns:78px minmax(0,1fr)}
html.rail .side{padding:22px 12px 14px;align-items:center}
html.rail .brand{padding:0 0 18px;text-align:center}
html.rail .brand b{font-size:15px}
html.rail .brand span,html.rail .nav-i>span,html.rail .nav-i em,html.rail #demoBox,html.rail .sync span{display:none}
html.rail .nav-i{padding:5px;justify-content:center}
html.rail .nav-i .ic{width:34px;height:34px;padding:7px}
html.rail .demo-chip{display:inline-flex}

/* ---------- ajuste a la ventana: el panel se escala para caber entero (ordenador y tablet) ---------- */
html.fit,html.fit body{overflow:hidden}
html.fit .app{position:fixed;top:0;left:0;transform-origin:0 0}

/* ---------- móvil: la pantalla es demasiado pequeña, la página pasa a desplazarse ---------- */
@media (max-width:599px){
  .main{overflow-y:auto}
  .page{height:auto;min-height:100%;padding-inline:16px;padding-block:18px 120px}
  .view{display:flex;flex-direction:column}
  .card{overflow:visible}
  .scroll{overflow:visible;flex:none;margin-right:0;padding-right:0}
  .gwrap{overflow:visible}
  .grow,.bars,.wchart,.heat-wrap{flex:none;height:160px}
  .cal{flex:none;grid-auto-rows:44px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quote{text-align:left}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .lt{font-size:30px}
  .m-only{display:flex}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}

}}

const wd=s=>(parse(s).getDay()+6)%7;
const weekStart=s=>addDays(s,-wd(s));
const fmt=(s,o)=>parse(s).toLocaleDateString('es-ES',o);
const fmtShort=s=>fmt(s,{day:'numeric',month:'short'}).replace('.','');
const monShort=s=>fmt(s,{month:'short'}).replace('.','');
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));

  const n=diff(today(),s);
  if(n===0)return 'Hoy'; if(n===1)return 'Mañana'; if(n===-1)return 'Ayer';
  if(n>1&&n<7)return 'En '+n+' días'; if(n<0&&n>-7)return 'Hace '+(-n)+' días';

  const d=[...days].map(Number).sort();

  const m=line.match(/^(.+?)\s+(\d+)\s*[x×]\s*(\d+)\s*(?:s|seg|rep|reps)?(?:\s+([\d.,]+)\s*kg)?\s*$/i);

const LS='midia.v1';

function commit(...keys){
  if(isDemo){isDemo=false;KEYS.forEach(k=>dirty.add(k));}
  keys.forEach(k=>dirty.add(k));
  lsSet();render();
  clearTimeout(saveT);saveT=setTimeout(flush,600);
}
async function flush(){
  if(!db||!uid){dirty.clear();return;}
  if(flushing){saveT=setTimeout(flush,400);return;}
  flushing=true;setSync('saving');
  const ks=[...dirty];dirty.clear();let failed=false;
  for(const k of ks){
    try{await db.doc(`data/users/${uid}/${k}`).set({v:1,data:S[k]});}
    catch(e){failed=true;if(!e||e.code==='unavailable'||e.code==='resource_exhausted')dirty.add(k);}
  }
  flushing=false;
  if(failed){setSync('err');if(dirty.size)saveT=setTimeout(flush,3000);}else setSync('cloud');
}
let syncState='local';
function setSync(m){
  if(m==='saving'&&mode!=='cloud')return;

  syncState=m;

async function connect(){
  if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return;}

    const [d,u,dl]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads').catch(()=>null)]);
    DL=dl;
    const id=u?await u.id():null;
    if(!d||!id){setSync('local');return;}

    const snaps=await Promise.all(KEYS.map(k=>db.doc(`data/users/${uid}/${k}`).get()));
    if(snaps.some(s=>s.exists)){

      S=normalize(fresh);isDemo=false;lsSet();render();

  try{const [hd,b]=d.split(',');const mime=(hd.match(/data:([^;]+)/)||[])[1]||'image/jpeg';const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([u],{type:mime}));}
  catch(e){return d;}
}
function setPhotoLocal(id,d){
  if(PHU[id]&&PHU[id].startsWith('blob:'))URL.revokeObjectURL(PHU[id]);
  if(d){PH[id]=d;PHU[id]=dataToBlobUrl(d);}else{delete PH[id];delete PHU[id];}

    const fr=new FileReader();

      img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*sc),hh=Math.round(img.height*sc);
        const cv=document.createElement('canvas');cv.width=w;cv.height=hh;cv.getContext('2d').drawImage(img,0,0,w,hh);
        let q=cap>220000?.9:.82,d=cv.toDataURL('image/jpeg',q);while(d.length>cap&&q>.42){q-=.1;d=cv.toDataURL('image/jpeg',q);}res(d);};

function dosesFor(d){
  const out=[],w=wd(d),tk=S.health.taken[d]||{};

    if(m.start&&d<m.start)continue;if(m.end&&d>m.end)continue;if(!(m.days||[]).map(Number).includes(w))continue;
    const dose=doseLabel(m,d),cx=!!m.cyc;for(const t of m.times||[]){const key=m.id+'@'+t;out.push({m,t,key,taken:!!tk[key],dose,cx});}
  }

}
function adherence(days=7){

  for(let i=days-1;i>=0;i--){const d=addDays(t,-i);for(const x of dosesFor(d)){if(i===0&&x.t>n&&!x.taken)continue;tot++;if(x.taken)ok++;}}

function cycleInfo(){
  const P=S.profile,t=today();
  const days=Object.keys(S.cycle.days).filter(d=>S.cycle.days[d]&&S.cycle.days[d].period).sort();
  const groups=[];
  for(const d of days){const g=groups[groups.length-1];if(g&&diff(g.end,d)<=2)g.end=d;else groups.push({start:d,end:d});}
  const lens=[];for(let i=1;i<groups.length;i++){const l=diff(groups[i-1].start,groups[i].start);groups[i-1].len=l;if(l>=18&&l<=60)lens.push(l);}
  const rc=lens.slice(-6),avgC=rc.length?Math.round(sum(rc)/rc.length):(+P.cycleLen||28);
  const pl=groups.filter((g,i)=>g.end<t||i<groups.length-1).slice(-6).map(g=>diff(g.start,g.end)+1);
  const avgP=pl.length?Math.round(sum(pl)/pl.length):(+P.periodLen||5);
  const last=groups[groups.length-1];
  const info={groups,avgC,avgP,last,predDays:[],fertDays:[],ovDays:[]};
  if(!last)return info;
  const day=diff(last.start,t)+1,next=addDays(last.start,avgC),late=Math.max(0,diff(next,t));
  const ov=addDays(next,-14),fs=addDays(ov,-5),fe=addDays(ov,1);
  Object.assign(info,{day,next,late,ov,fs,fe,toNext:diff(t,next)});
  for(let k=0;k<6;k++){
    const s=addDays(next,k*avgC);
    if(!(k===0&&late>0))for(let i=0;i<avgP;i++){const d=addDays(s,i);if(d>last.end)info.predDays.push(d);}
    const o=addDays(s,-14);if(o>last.end){info.ovDays.push(o);for(let i=-5;i<=1;i++)info.fertDays.push(addDays(o,i));}
  }
  let phase,tip;
  if(t>=last.start&&t<=last.end){phase='Menstrual';tip='La energía suele estar más baja: prioriza el descanso y entrenos suaves.';}
  else if(late>0){phase='Retraso';tip=`El periodo lleva ${late} ${late===1?'día':'días'} de retraso respecto a la predicción.`;}
  else if(t===ov){phase='Ovulación';tip='Día estimado de ovulación, dentro de la ventana fértil.';}
  else if(t>=fs&&t<=fe){phase='Ventana fértil';tip='Días con mayor probabilidad de embarazo según tus registros.';}
  else if(t<fs){phase='Folicular';tip='La energía suele subir: buen momento para entrenos intensos y subir cargas.';}
  else{phase='Lútea';tip='Puede aparecer cansancio, hinchazón o antojos. Escucha a tu cuerpo.';}
  info.phase=phase;info.tip=tip;
  return info;
}

function ring(p,cvar,size=64,sw=8,inner=''){

}
function donut(segs,size=140,sw=18,inner=''){
  const tot=sum(segs.map(s=>s.v))||1,r=(size-sw)/2,C=2*Math.PI*r;let off=0,h='';
  for(const s of segs){const len=s.v/tot*C;if(len<=0)continue;h+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:${s.col}" stroke-width="${sw}" stroke-dasharray="${Math.max(.5,len-2).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"><title>${esc(s.l)}</title></circle>`;off+=len;}
  return `<div class="ringc" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Gráfico circular"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--fill2)" stroke-width="${sw}"/>${h}</svg>${inner?`<div class="in">${inner}</div>`:''}</div>`;
}
function bars(items,{goal=0,cvar='--coral',unit='',goalLabel=''}={}){

function cycleDayAt(d){
  const ci=cycleInfo();let g=null;for(const x of ci.groups)if(x.start<=d)g=x;
  if(!g)return null;const n=diff(g.start,d)+1;

  return{n,phase,avgC:ci.avgC};
}

    const pd=diff(ci.last.start,ci.last.end)+1,fs=diff(ci.last.start,ci.fs)+1,fe=diff(ci.last.start,ci.fe)+1;
    const ang=2*Math.PI*((ci.day-.5)/L)-Math.PI/2,mx=size/2+r*Math.cos(ang),my=size/2+r*Math.sin(ang);
    const svg=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--fill2)" stroke-width="${sw_}"/>${arc(1,pd,'--rose',1)}${arc(fs,fe,'--sky',.6)}<circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="${sw_/2+3}" style="fill:var(--card);stroke:var(--ink)" stroke-width="2.5"/></svg>`;
    ringC=card('ring','',`<div class="cyring"><div class="ringc" style="width:${size}px;height:${size}px">${svg}<div class="in"><span class="eyebrow" style="--c:var(--rose)">${esc(ci.phase)}</span><b style="font-size:36px;margin-top:2px">Día ${ci.day}</b><span>de ${ci.avgC}</span></div></div>

const BILL_CATS=['Hipoteca','Alquiler','Préstamo','Seguros','Comunidad','Impuestos','Suministros','Suscripciones','Otros'];
const FREQ=[['1','Mensual'],['2','Bimestral'],['3','Trimestral'],['6','Semestral'],['12','Anual']];
const FREQ_L={1:'Mensual',2:'Bimestral',3:'Trimestral',6:'Semestral',12:'Anual'};
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const eur=n=>{const o={style:'currency',currency:'EUR',minimumFractionDigits:Math.abs(n%1)>0.004?2:0,maximumFractionDigits:Math.abs(n%1)>0.004?2:0,useGrouping:'always'};try{return (+n||0).toLocaleString('es-ES',o);}catch(e){delete o.useGrouping;return (+n||0).toLocaleString('es-ES',o);}};
const dimOf=ymS=>{const [y,m]=ymS.split('-').map(Number);return new Date(y,m,0).getDate();};
const ymAdd=(ymS,n)=>{const [y,m]=ymS.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
function billIn(b,ymS){
  const m=+ymS.slice(5,7),step=+b.freq||1,a=+b.month||1;
  if(b.start&&ymS<b.start.slice(0,7))return false;
  if(b.end&&ymS>b.end.slice(0,7))return false;
  return ((m-a)%step+step)%step===0;
}
const billDate=(b,ymS)=>ymS+'-'+pad(Math.min(+b.day||1,dimOf(ymS)));
const incomeAmt=(i,ymS)=>(+i.amount||0)*(1+((i.extras||[]).map(Number).includes(+ymS.slice(5,7))?1:0));
const monthlyEq=b=>(+b.amount||0)/(+b.freq||1);
function finMonth(ymS){
  const F=S.finance,pd=F.paid[ymS]||{};
  const bills=F.bills.filter(b=>billIn(b,ymS)).map(b=>({b,date:billDate(b,ymS),paid:billPaid(b,ymS)})).sort((x,y)=>x.date.localeCompare(y.date));
  const incs=F.incomes.map(i=>({i,date:ymS+'-'+pad(Math.min(+i.day||1,dimOf(ymS))),amount:incomeAmt(i,ymS)})).sort((x,y)=>x.date.localeCompare(y.date));
  const exps=F.expenses.filter(e=>e.date.startsWith(ymS)).sort((a,b)=>b.date.localeCompare(a.date));
  const inc=sum(incs.map(x=>x.amount)),fixed=sum(bills.map(x=>x.b.amount)),vari=sum(exps.map(e=>e.amount));
  const byCat={};for(const e of exps)byCat[e.cat]=(byCat[e.cat]||0)+(+e.amount||0);
  return{bills,incs,exps,inc,fixed,vari,byCat};
}
function billsDue(){/* pagos fijos de este mes sin pagar y con fecha de hoy o anterior */
  const t=today();return finMonth(t.slice(0,7)).bills.filter(x=>!x.paid&&x.date<=t);
}

/* Orientación general de presupuesto calculada con los datos de la persona (no es asesoramiento financiero). */
function finAdvice(){
  const F=S.finance,t=today(),ymS=t.slice(0,7),M=finMonth(ymS),out=[];
  const active=F.bills.filter(b=>!b.end||b.end>=t);
  const incAvg=sum(F.incomes.map(i=>(+i.amount||0)*(12+(i.extras||[]).length)/12));
  const fixedAvg=sum(active.map(monthlyEq));
  const prev=[1,2,3].map(k=>ymAdd(ymS,-k));
  const varPrev=prev.map(p=>sum(F.expenses.filter(e=>e.date.startsWith(p)).map(e=>e.amount))).filter(v=>v>0);
  const varAvg=varPrev.length?sum(varPrev)/varPrev.length:M.vari;
  const daysLeft=dimOf(ymS)-(+t.slice(8))+1,goal=+F.saveGoal||0;
  const left=M.inc-M.fixed-goal-M.vari;
  if(M.inc>0)out.push(left>=0
    ?{c:'--teal',t:`Puedes gastar unos ${eur(Math.floor(left/daysLeft))} al día`,d:`Te quedan ${eur(left)} para gastos variables hasta fin de mes, ya descontados los pagos fijos y ${eur(goal)} de ahorro.`}
    :{c:'--coral',t:'Este mes vas por encima de lo previsto',d:`Superas en ${eur(-left)} lo disponible tras pagos fijos y tu objetivo de ahorro. Frena los gastos variables hasta la próxima nómina.`});

function accMoves(id,ymS){

    if(x.to===id)out.push({d:x.date,t:'Desde '+accName(x.from),s:'Traspaso recibido',a:x.amount,done:x.done,c:accColor(x.from),act});

function accBalance(a){

  for(let m=from.slice(0,7),k=0;m<=t.slice(0,7)&&k<240;m=ymAdd(m,1),k++)for(const mv of accMoves(a.id,m))if(mv.done&&mv.d>=from&&mv.d<=t)bal+=mv.a;
  return Math.round(bal*100)/100;

function setBalance(a,value){/* el saldo real de hoy: lo ya registrado hoy se vuelve a sumar en el cálculo */
  const t=today();const todays=sum(accMoves(a.id,t.slice(0,7)).filter(mv=>mv.done&&mv.d===t).map(mv=>mv.a));

function mainProjection(){
  const a=mainAcc();if(!a)return null;const t=today(),ymS=t.slice(0,7);

function pocketCycle(a){

  for(const m of [t.slice(0,7),ymAdd(t.slice(0,7),-1)])for(const x of transfersOf(m))if(x.to===a.id&&x.done&&x.date<=t&&(!last||x.date>last.date))last=x;

}

/* Proyección mes a mes: cuenta principal + cuentas de ahorro, situación actual frente a escenario. */
function simulate(inp){
  const F=S.finance,t=today(),N=Math.max(1,Math.min(120,Math.round(+inp.meses||12)));
  const changes=Array.isArray(inp.cambios)?inp.cambios:[];
  const rate=Math.max(-50,Math.min(50,+inp.rentabilidad_anual_pct||0))/100/12;
  const main=mainId(),sv=accs().filter(a=>a.role==='ahorro').map(a=>a.id);
  const prev=[1,2,3].map(k=>ymAdd(t.slice(0,7),-k));
  const mainExp=sum(prev.map(p=>sum(F.expenses.filter(e=>e.date.startsWith(p)&&expAcc(e)===main).map(e=>+e.amount||0))))/3;
  const ma=mainAcc();let bCash=ma?accBalance(ma):0,sCash=bCash,bSav=sum(sv.map(id=>accBalance(accById(id)))),sSav=bSav;
  const rows=[];let ym=t.slice(0,7);
  for(let k=1;k<=N;k++){ym=ymAdd(ym,1);
    const inc=sum(F.incomes.filter(i=>incAcc(i)===main).map(i=>incomeAmt(i,ym)));
    const bills=sum(F.bills.filter(b=>billIn(b,ym)&&billAcc(b)===main).map(b=>+b.amount||0));
    const trS=sum((F.transfers||[]).filter(x=>x.from===main&&sv.includes(x.to)&&trIn(x,ym)).map(x=>+x.amount||0));
    const trP=sum((F.transfers||[]).filter(x=>x.from===main&&!sv.includes(x.to)&&trIn(x,ym)).map(x=>+x.amount||0));
    const free=inc-bills-trS-trP-mainExp;
    let dIn=0,dOut=0,dSav=0,dSavOut=0;
    for(const c of changes){const s=Math.max(1,Math.round(+c.desde_mes||1)),d=c.duracion_meses?Math.max(1,Math.round(+c.duracion_meses)):Infinity,a=+c.importe||0,on=k>=s&&k<s+d;
      switch(String(c.tipo)){
        case 'ingreso_mensual':if(on)dIn+=a;break;
        case 'gasto_mensual':if(on)dOut+=a;break;
        case 'ahorro_mensual':if(on)dSav+=a;break;
        case 'gasto_puntual':if(k===s){if(c.desde_ahorro)dSavOut+=a;else dOut+=a;}break;
        case 'ingreso_puntual':if(k===s)dIn+=a;break;}}
    bSav=bSav*(1+rate)+trS;sSav=sSav*(1+rate)+trS+dSav-dSavOut;
    bCash+=free;sCash+=free+dIn-dOut-dSav;
    rows.push({mes:ym,libre_mes_base:r0(free),libre_mes_escenario:r0(free+dIn-dOut-dSav),principal_base:r0(bCash),principal_escenario:r0(sCash),ahorro_base:r0(bSav),ahorro_escenario:r0(sSav)});}
  const last=rows[rows.length-1],low=rows.reduce((m,r)=>r.principal_escenario<m.principal_escenario?r:m,rows[0]);
  const step=N>36?Math.ceil(N/24):1,serie=rows.filter((r,i)=>i%step===step-1||i===rows.length-1);
  CHAT.pendingSim={titulo:String(inp.titulo||'Escenario').slice(0,80),meses:N,labels:rows.map(r=>r.mes),base:rows.map(r=>r.principal_base+r.ahorro_base),esc:rows.map(r=>r.principal_escenario+r.ahorro_escenario),
    finBase:last.principal_base+last.ahorro_base,finEsc:last.principal_escenario+last.ahorro_escenario,neg:rows.filter(r=>r.principal_escenario<0).length,low:{mes:low.mes,v:low.principal_escenario}};
  renderSimPanel();
  return{meses:N,supuestos:{gasto_medio_mensual_pagado_con_la_cuenta_principal:r0(mainExp),rentabilidad_anual_pct:+inp.rentabilidad_anual_pct||0,
      nota:'Lo que sobra cada mes se acumula en la cuenta principal; los gastos de las cuentas de gasto se cubren con sus traspasos. No incluye impuestos sobre rendimientos.'},
    al_final:{principal_base:last.principal_base,principal_escenario:last.principal_escenario,ahorro_base:last.ahorro_base,ahorro_escenario:last.ahorro_escenario,
      total_base:last.principal_base+last.ahorro_base,total_escenario:last.principal_escenario+last.ahorro_escenario},
    mes_con_principal_mas_bajo_en_escenario:{mes:low.mes,saldo:low.principal_escenario},meses_con_principal_en_negativo:rows.filter(r=>r.principal_escenario<0).length,serie};
}

function simChart(sim){
  const W=300,H=120,all=[...sim.base,...sim.esc,0],mn=Math.min(...all),mx=Math.max(...all),rg=(mx-mn)||1,n=sim.base.length;
  const X=i=>n>1?i/(n-1)*W:W/2,Y=v=>H-6-(v-mn)/rg*(H-12);
  const path=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const zero=mn<0?`<line x1="0" x2="${W}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" style="stroke:var(--coral)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>`:'';
  return `<svg class="simsvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolución: situación actual frente al escenario">${zero}<path d="${path(sim.base)}" fill="none" style="stroke:var(--ink3)" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/><path d="${path(sim.esc)}" fill="none" style="stroke:url(#g-teal)" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
    <div class="simx"><span>${esc(cap(fmt(sim.labels[0]+'-01',{month:'short',year:'2-digit'}).replace('.','')))}</span><span>${esc(cap(fmt(sim.labels[n-1]+'-01',{month:'short',year:'2-digit'}).replace('.','')))}</span></div>`;
}
function simPanelHTML(){
  const s=finSnapshot(),m=s.medias_mensuales,sim=CHAT.pendingSim||S.finance.lastSim;
  const saldoAhorro=sum(s.cuentas.filter(c=>c.tipo==='Ahorro').map(c=>c.saldo_hoy));
  const libre=m.ingresos-m.recibos-m.ahorro_programado-m.a_cuentas_de_gasto;
  const kv=(l,v,c)=>`<div class="kvl"><span>${l}</span><b class="num" style="${c?`color:${c}`:''}">${v}</b></div>`;
  const facts=`<div class="facts">${kv('Ingresos medios al mes',eur(m.ingresos))}${kv('Recibos fijos al mes',eur(m.recibos))}${kv('Traspasos a cuentas de gasto',eur(m.a_cuentas_de_gasto))}${kv('Ahorro programado al mes',eur(m.ahorro_programado))}${kv('Margen libre al mes',eur(libre),libre<0?'color-mix(in srgb,var(--coral) 55%,var(--ink))':'')}${kv('Ahorro acumulado',eur(saldoAhorro))}</div>`;
  const chart=sim?`<div class="subhd">Último escenario</div><div class="simt">${esc(sim.titulo)} · ${sim.meses} meses</div>${simChart(sim)}
    <div class="simleg"><span><i class="ln"></i>Escenario</span><span><i class="ln base"></i>Situación actual</span></div>
    <div class="kvl" style="margin-top:6px"><span>Total al final (principal + ahorro)</span><b class="num">${eur(sim.finEsc)}</b></div>
    <div class="kvl"><span>Diferencia frente a hoy</span><b class="num" style="color:${sim.finEsc-sim.finBase<0?'color-mix(in srgb,var(--coral) 55%,var(--ink))':'color-mix(in srgb,var(--mint) 45%,var(--ink))'}">${sim.finEsc-sim.finBase>=0?'+':''}${eur(sim.finEsc-sim.finBase)}</b></div>
    ${sim.neg?`<div class="kvl"><span>Meses con la cuenta principal en negativo</span><b class="num" style="color:color-mix(in srgb,var(--coral) 55%,var(--ink))">${sim.neg}</b></div>`:''}`
    :'<div class="subhd">Último escenario</div><div class="empty">Pregunta algo como «¿y si…?» y aquí verás la gráfica del escenario frente a tu situación actual.</div>';
  return facts+chart;
}

async function finAsk(q){
  q=String(q||'').trim();if(!q||CHAT.busy)return;
  const sample=await getSample();
  if(!sample){CHAT.avail=false;render();return;}
  const F=S.finance;F.chat=F.chat||[];F.chat.push({role:'user',content:q});
  UI.chatDraft='';CHAT.busy=true;CHAT.live='';CHAT.status='';CHAT.pendingSim=null;render();
  const log=document.getElementById('chat-log');if(log)log.scrollTop=log.scrollHeight;
  const turns=[{role:'user',content:finRules()},...F.chat.slice(-12).filter(m=>m.content&&m.content.trim())];
  CHAT.ctl=new AbortController();
  let tools;try{const lim=await sample.limits();if(lim&&lim.tools)tools=[SIM_TOOL];}catch(e){}
  let answer='';
  try{
    const r=await sample(turns,{signal:CHAT.ctl.signal,cache:false,modelTier:'default',...(tools?{tools}:{}),onText:({text})=>{CHAT.live=text;CHAT.status='';updateLive();}});
    answer=r.text+(r.truncated?'\n\n(Respuesta cortada: prueba a preguntar menos cosas a la vez.)':'');
  }catch(e){
    const code=e&&e.code;const part=(e&&e.text)||'';
    if(code==='not_granted'||code==='sampling_disabled'||code==='not_declared'||code==='capability_disabled'||code==='capability_removed')CHAT.off='No tienes permiso para usar Claude desde la app. Puedes activarlo en el menú de permisos del artefacto.';
    const note=code==='cancelled'?'(Respuesta detenida.)':code==='rate_limited'?'Has hecho muchas preguntas seguidas o has llegado a tu límite de uso. Prueba de nuevo en un rato.':code==='refused'?'No puedo responder a eso. Prueba a plantearlo de otra forma.':code==='session_expired'?'Tu sesión ha caducado: vuelve a iniciar sesión en Claude.':CHAT.off?'':'No se pudo completar la respuesta. Inténtalo de nuevo.';
    answer=[code==='refused'?'':part,note].filter(Boolean).join('\n\n');
  }finally{
    if(answer)F.chat.push({role:'assistant',content:answer});else F.chat.pop();
    if(CHAT.pendingSim){F.lastSim=CHAT.pendingSim;CHAT.pendingSim=null;}
    F.chat=F.chat.slice(-30);CHAT.busy=false;CHAT.ctl=null;CHAT.live='';CHAT.status='';
    commit('finance');
    const lg=document.getElementById('chat-log');if(lg)lg.scrollTop=lg.scrollHeight;
  }
}
